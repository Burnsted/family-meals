<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220" id="theme-color-meta">
<script>(function(){try{var t=localStorage.getItem("cm-theme");if(t!=="light"&&t!=="dark")t="dark";document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;if(t==="light")document.documentElement.classList.add("theme-light");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
<title>My Meal Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--chip:#334155;--on:#0ea5e9;--gold:#f59e0b}
  html[data-theme="light"]{--bg:#f4f7f6;--card:#fffaf4;--ink:#173042;--mut:#5b6b7a;--chip:#d5e3df;--on:#0f6e6e;--gold:#c47a2c}
  html[data-theme="light"] body{background:var(--bg);color:var(--ink)}
  html[data-theme="light"] .card,html[data-theme="light"] .welcome-card{background:var(--card);color:var(--ink)}
  html[data-theme="light"] .addrow input,html[data-theme="light"] .welcome-field,html[data-theme="light"] .ph-new-row input{background:#fff;color:var(--ink);border-color:rgba(15,110,110,.28)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
  .wrap{width:100%;max-width:440px;padding:20px 16px 40px}
  .top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin-bottom:10px}
  .bar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;background:var(--on);transition:width .3s}
  .card{background:var(--card);border-radius:18px;padding:22px 18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .emoji{font-size:64px;line-height:1;margin:4px 0 10px}
  h1{font-size:24px;margin:0 0 6px}
  p.sub{color:var(--mut);margin:0 0 18px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:4px 0 20px}
  .chip{border:2px solid var(--on);background:var(--on);color:#fff;border-radius:999px;padding:10px 14px;font-size:16px;cursor:pointer;user-select:none}
  .chip.off{background:transparent;color:var(--ink);border-color:var(--chip)}
  .chip.drop.off{/* unselected — same look as .chip.off, not struck */}
  .chip.main{background:var(--gold);border-color:var(--gold)}
  .chip.open{outline:3px solid var(--gold);outline-offset:2px}
  .chip.addc{background:transparent;border:2px dashed var(--mut);color:var(--mut)}
  .chip.cust:not(.off){background:#8b5cf6;border-color:#8b5cf6}
  .next{width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:var(--on);color:#fff;cursor:pointer}
  .next:disabled{opacity:.4}
  .ghost{background:transparent;color:var(--mut);font-weight:500;font-size:15px;margin-top:8px;padding:10px}
  .addrow{display:flex;gap:8px;margin:0 0 18px}
  .addrow input{flex:1;min-width:0;border-radius:12px;border:2px solid var(--chip);background:#0b1222;color:var(--ink);padding:12px;font-size:16px}
  .addrow button{border:0;border-radius:12px;background:var(--chip);color:#fff;padding:0 16px;font-size:16px;cursor:pointer}
  .addrow.cust input{border-color:#8b5cf6}.addrow.cust button{background:#8b5cf6}
  .photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:0 0 18px}
  .ph{position:relative;aspect-ratio:3/4;border:2px dashed var(--chip);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;font-size:14px;color:var(--mut)}
  .ph span.big{font-size:34px;margin-bottom:6px}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph.done{border:2px solid var(--on)}
  .ph .ok{position:absolute;bottom:6px;left:6px;right:6px;background:rgba(14,165,233,.9);color:#fff;border-radius:8px;padding:3px;font-size:12px}
  .ph input{display:none}
  .photos{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .ph-sec{position:relative;border:2px dashed var(--chip);border-radius:14px;padding:10px 8px 8px;display:flex;flex-direction:column;gap:6px;min-height:140px;text-align:center}
  .ph-sec.done{border-color:var(--on)}
  .ph-sec-lab{font-size:13px;font-weight:800;color:var(--ink);line-height:1.2}
  .ph-sec-lab .big{display:block;font-size:28px;margin-bottom:2px}
  .ph-thumbs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
  .ph-thumb{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:2px solid var(--chip);flex-shrink:0}
  .ph-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ph-thumb .ph-x{position:absolute;top:1px;right:1px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(15,23,42,.75);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;line-height:0}
  .ph-thumb .ph-x .ico{width:12px;height:12px;stroke:#fff}
  .ph-add{appearance:none;border:0;background:transparent;color:var(--tealD,#0ea5e9);font:inherit;font-size:12px;font-weight:800;text-decoration:underline;text-underline-offset:2px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:4px 2px}
  .ph-add .ico{width:14px;height:14px;stroke:currentColor}
  .ph-add-sec{appearance:none;border:2px dashed var(--chip);border-radius:14px;background:transparent;color:var(--mut);min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:inherit;font-weight:800;font-size:13px}
  .ph-add-sec .ico{width:22px;height:22px;stroke:currentColor}
  .ph-sec-del{appearance:none;position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(15,23,42,.7);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
  .ph-sec-del .ico{width:12px;height:12px;stroke:#fff}
  .ph-new-row{display:flex;gap:8px;margin:0 0 12px;align-items:center}
  .ph-new-row input{flex:1;min-height:44px;border-radius:12px;border:2px solid var(--chip);background:#0b1222;color:var(--ink);padding:10px;font:inherit;font-weight:700}
  .sum{text-align:left}
  .sum h2{font-size:17px;margin:16px 0 6px}
  .sum p{margin:0}
  .tag{display:inline-block;background:var(--chip);border-radius:999px;padding:4px 10px;margin:3px;font-size:14px}
  .tag.y{background:#065f46}
  .no{color:var(--mut);font-size:14px}
  .muted{color:var(--mut);font-size:13px;margin-top:16px}
  /* variant pop list */
  .pop{background:#0b1222;border:2px solid var(--gold);border-radius:16px;padding:12px;margin:-8px 0 18px;text-align:left;animation:pop .15s ease}
  .pop .ph2{font-size:14px;color:var(--gold);font-weight:700;margin:0 0 8px}
  .pop .opts{display:flex;flex-wrap:wrap;gap:8px}
  .popt{border:2px solid var(--chip);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px;cursor:pointer}
  .popt.sel{background:var(--on);border-color:var(--on);color:#fff}
  .popt.rm{border-color:#7f1d1d;color:#fca5a5}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
  /* equipment */
  .feat{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--chip);border-radius:18px;padding:14px;margin:0 0 8px;cursor:pointer;background:#0b1222}
  .feat.on{border-color:var(--gold);background:linear-gradient(135deg,#3b2a06,#1e293b)}
  .feat .fe{font-size:40px}
  .feat b{font-size:18px}
  .feat .dad{color:var(--gold);font-size:14px;margin-top:3px}
  .feat .ck{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--chip);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .feat.on .ck{background:var(--gold);border-color:var(--gold);color:#111}
  .fnote{font-size:13px;color:var(--mut);margin:0 0 16px}
  .lbl{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 8px}
  /* meals yes/no */
  .meals{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;text-align:left}
  .meal{background:#0b1222;border:2px solid var(--chip);border-radius:16px;padding:10px 12px}
  .meal.yes{border-color:#10b981}.meal.no{opacity:.55}
  .mrow{display:flex;align-items:center;gap:10px}
  .me{font-size:34px;line-height:1}
  .mt{flex:1;min-width:0}
  .mt b{font-size:16px}
  .vchip{display:inline-block;margin-top:4px;border:2px solid var(--gold);color:var(--gold);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
  .fb{display:inline-block;margin-top:4px;font-size:12px;color:#fbbf24}
  .yn{display:flex;gap:6px}
  .yn button{border:2px solid var(--chip);background:transparent;color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;cursor:pointer}
  .yn button.y.sel{background:#10b981;border-color:#10b981}
  .yn button.n.sel{background:#7f1d1d;border-color:#7f1d1d}
  .tipbtn{display:block;width:100%;margin-top:8px;border:0;background:transparent;color:var(--on);text-align:left;font-size:14px;padding:4px 0;cursor:pointer}
  .tip{margin-top:6px;background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
  .tip ol{margin:6px 0;padding-left:20px}
  .tip .t1{color:#fbbf24;font-weight:700}
  .tip .t2{color:#f87171;font-weight:700}
  .tip .t3{color:var(--mut);font-size:12px}
  details.box{background:#0b1222;border:2px solid var(--chip);border-radius:14px;padding:10px 12px;margin:0 0 16px;text-align:left}
  details.box summary{cursor:pointer;font-weight:700}
  details.box ul{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.45}
  .build{background:linear-gradient(135deg,#f59e0b,#d97706);font-size:22px;padding:20px;margin-top:18px;box-shadow:0 6px 0 rgba(146,64,14,.6)}
  /* ===== week planner (light, like Ted's family site) ===== */
  body.light{--wbg:#eef6f2;--wink:#173042;--wsoft:#3d5566;--teal:#0f6e6e;--tealD:#0a5555;--tealS:#d4efef;--coral:#d4572a;--coralD:#b9441c;--coralS:#ffe3d6;--wgold:#d9a441;--white:#fffaf4;
    background:radial-gradient(circle at 10% 0%,rgba(15,110,110,.16),transparent 38%),radial-gradient(circle at 95% 12%,rgba(212,87,42,.12),transparent 34%),linear-gradient(180deg,#f4faf7 0%,#eef6f2 42%,#f8f1e8 100%);color:var(--wink);font-family:Nunito,Segoe UI,sans-serif}
  #week{display:none;width:100%;max-width:460px;padding:14px 14px 50px}
  body.light #week{display:block} body.light .wrap{display:none}
  .wk-h{text-align:center;padding:4px 0 10px}
  .kick{margin:0;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tealD)}
  .brand{margin:2px 0 0;font-family:Fraunces,Georgia,serif;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
  .wlabel{display:inline-block;margin:10px 0 4px;border:2px solid var(--teal);background:var(--white);color:var(--coralD);font-weight:800;border-radius:14px;padding:8px 18px;box-shadow:0 4px 0 rgba(15,110,110,.16)}
  .tagline{margin:6px auto 0;color:var(--wsoft);font-weight:700;font-size:14px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
  .pill{font-weight:800;padding:7px 12px;border-radius:12px;font-size:14px}
  .pill.t{background:var(--tealS);color:var(--tealD)}.pill.c{background:var(--coralS);color:var(--coralD)}
  .rules{margin:6px 0 14px;padding:12px 14px;background:linear-gradient(135deg,#124f4f,var(--teal));color:#fff;border-radius:16px;box-shadow:0 8px 22px rgba(23,48,66,.12)}
  .rules h2{margin:0 0 6px;font-family:Fraunces,Georgia,serif;font-size:17px}
  .rules ul{margin:0;padding-left:18px;font-weight:650;font-size:13px;line-height:1.4}
  .rules li+li{margin-top:3px}
  .lt{background:var(--white);border:2px dashed rgba(212,87,42,.55);border-radius:16px;padding:10px 14px;margin:0 0 14px;box-shadow:0 8px 22px rgba(23,48,66,.12)}
  .lt summary{font-weight:800;color:var(--coralD);cursor:pointer;font-size:16px}
  .lt ul{margin:8px 0 0;padding-left:18px;font-weight:650;color:var(--wsoft);font-size:14px}
  .stitle{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 10px}
  .stitle h2{margin:0;font-family:Fraunces,Georgia,serif;font-size:22px}
  .stitle span{color:var(--wsoft);font-weight:700;font-size:13px}
  .day{background:var(--white);border-radius:16px;box-shadow:0 8px 22px rgba(23,48,66,.12);overflow:hidden;margin-bottom:12px;cursor:pointer;animation:pi .4s ease both}
  @keyframes pi{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1}}
  .dh{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--teal),var(--tealD));color:#fff;padding:9px 14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
  .day.cook .dh{background:linear-gradient(135deg,var(--coral),var(--coralD))}
  .db{padding:12px 14px 14px}
  .memo{font-size:36px;line-height:1;display:block;margin-bottom:4px}
  .dinner{margin:0;font-size:18px;font-weight:800}
  .dnote{margin:7px 0 0;padding:7px 10px;background:var(--coralS);border-radius:10px;color:var(--coralD);font-weight:800;font-size:14px}
  .day:not(.cook) .dnote{background:var(--tealS);color:var(--tealD)}
  .dl{margin:7px 0 0;font-weight:700;font-size:14px;color:var(--wink)}
  .dl.b{color:var(--wsoft);font-weight:650}
  .hint{margin:7px 0 0;color:var(--wsoft);font-size:12px;font-weight:700}
  .rec{margin-top:10px;padding:10px 12px;background:var(--wbg);border-left:5px solid var(--teal);border-radius:12px;font-size:14px;font-weight:650;color:var(--wsoft)}
  .rec h4{margin:0 0 4px;color:var(--tealD);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
  .rec ol{margin:0;padding-left:18px}
  .rec .t1{color:#b45309;font-weight:800}.rec .t2{color:#b91c1c;font-weight:800}.rec .t3{color:var(--wsoft);font-size:12px}
  .gpanel{background:var(--white);border-radius:20px;box-shadow:0 8px 22px rgba(23,48,66,.12);padding:14px;margin-bottom:16px}
  .tot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
  .tot div{background:var(--wbg);border-radius:12px;padding:8px 6px;text-align:center;font-weight:800;font-size:13px;color:var(--wsoft)}
  .tot b{display:block;font-size:19px;color:var(--wink)}
  .tot .best{background:var(--tealS);color:var(--tealD)}
  .tot .main{outline:2px solid var(--wgold)}
  .gnote{font-size:13px;font-weight:700;color:var(--wsoft);background:var(--coralS);border-radius:12px;padding:8px 10px;margin:0 0 6px}
  .aisle{margin:14px 0 4px;padding-bottom:3px;border-bottom:2px solid #dceee6;color:var(--tealD);font-size:16px;display:flex;justify-content:space-between}
  .aisle small{color:var(--wsoft);font-size:12px}
  .it{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px dashed rgba(23,48,66,.12)}
  .it .cb{width:26px;height:26px;border-radius:8px;border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;cursor:pointer}
  .it.ck .cb{background:var(--teal)}
  .it.ck .nm{text-decoration:line-through;opacity:.6}
  .nm{font-weight:800;font-size:15px;cursor:pointer}
  .nm small{display:block;font-weight:650;color:var(--wsoft);font-size:12px}
  .nm .src{color:var(--teal)}
  .pr{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;font-size:12px;font-weight:800}
  .pr span{white-space:nowrap}
  .pr span{padding:2px 6px;border-radius:8px;background:var(--wbg);color:var(--wsoft)}
  .pr span.win{background:#d1fae5;color:#065f46}
  .have{border:2px solid rgba(23,48,66,.15);background:#fff;border-radius:10px;padding:7px 8px;font-weight:800;font-size:12px;color:var(--wsoft);cursor:pointer;white-space:nowrap}
  .gone{opacity:.45}
  .gone .have{background:var(--wgold);color:var(--wink)}
  .gone .nm{text-decoration:line-through}
  .gh{display:block;background:#173042;color:#fff;border-radius:16px;padding:14px;text-decoration:none;margin:0 0 14px;box-shadow:0 8px 22px rgba(23,48,66,.18)}
  .gh b{font-size:16px}.gh span{display:block;font-size:13px;opacity:.85;margin-top:3px;font-weight:650}
  .wbtn{display:block;width:100%;border:0;border-radius:14px;min-height:52px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
  .wbtn.p{background:linear-gradient(160deg,var(--teal),var(--tealD));color:#fff}
  .wbtn.g{background:var(--white);color:var(--wink);border:2px solid rgba(23,48,66,.12)}
  .foot{text-align:center;color:var(--wsoft);font-weight:650;font-size:12px;margin-top:16px;line-height:1.5}
  .foot a{color:var(--teal)}

  /* ===== v3: receipt button, calendar, budget, week customizer, build extras, prep badges ===== */
  .rcpt-btn{border:0;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#111;font:inherit;font-weight:800;font-size:15px;padding:10px 16px;min-height:44px;cursor:pointer;box-shadow:0 4px 0 rgba(146,64,14,.45)}
  .rcpt-top{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap}
  body.light .rcpt-btn{background:linear-gradient(135deg,var(--coral),var(--coralD));color:#fff;box-shadow:0 4px 0 rgba(185,68,28,.3)}
  .wl-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px}
  .wl-row .wlabel{margin:0}
  .cal-btn{width:48px;height:48px;border-radius:14px;border:2px solid var(--teal);background:var(--white);font-size:22px;cursor:pointer;box-shadow:0 4px 0 rgba(15,110,110,.16);flex-shrink:0}
  .pill.btn{border:0;font:inherit;font-weight:800;cursor:pointer;min-height:40px}
  .pill.bud{background:#fff;color:var(--tealD);border:2px solid rgba(15,110,110,.35)}
  .pill.bud.off{background:#eef1f3;color:#7a8a96;border-color:#d5dde2;font-weight:700}
  .bcmp{margin:8px auto 0;max-width:380px;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
  .bcmp.under{background:#d1fae5;color:#065f46}.bcmp.over{background:#fee2e2;color:#991b1b}
  .sheet-bg{position:fixed;inset:0;background:rgba(23,48,66,.55);display:none;align-items:flex-end;justify-content:center;z-index:60;padding:10px}
  .sheet-bg.open{display:flex}
  .sheet{width:100%;max-width:440px;max-height:88vh;overflow:auto;background:#fffaf4;color:#173042;border-radius:22px 22px 16px 16px;padding:14px 14px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3);font-family:Nunito,Segoe UI,sans-serif;animation:pop .2s ease}
  .sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .sh-top h3{margin:0;font-family:Fraunces,Georgia,serif;font-size:21px}
  .sh-x{width:44px;height:44px;border:0;border-radius:12px;background:#dceee6;color:#173042;font-size:20px;font-weight:800;cursor:pointer;flex-shrink:0}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 6px}
  .cal-nav b{font-size:18px}.month-hold-hint{margin:2px 0 6px;padding:0;font-size:12px;font-weight:700;color:var(--wsoft,#7a8a96);text-align:center;line-height:1.2}
  .cal-nav button{width:44px;height:44px;min-width:44px;min-height:44px;border:0;border-radius:0;background:transparent;box-shadow:none;font-size:20px;font-weight:800;color:var(--tealD,#0a5555);cursor:pointer;padding:0}
  .cal-dow,.cal-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-dow span{text-align:center;font-size:12px;font-weight:800;color:#3d5566;padding:4px 0;text-transform:uppercase}
  .cal-row{border-radius:12px;padding:2px 0;margin:1px 0}

<script>
const C=window.CAM, STORES=C.STORES, BUILDS=C.BUILDS, SIDES=C.SIDES, SIDE_GROUPS=C.SIDE_GROUPS||[], DRILL=C.DRILL||{}, MEALS=C.MEALS;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);

const ICO=(p)=>`<svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const icons={
  cal:ICO(`<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>`),
  gear:ICO(`<path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/>`),
  shuffle:ICO(`<path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>`),
  repeat:ICO(`<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>`),
  swap:ICO(`<polyline points="16 3 21 3 21 8"/><line x1="21" y1="3" x2="14" y2="10"/><polyline points="8 21 3 21 3 16"/><line x1="3" y1="21" x2="10" y2="14"/>`),
  del:ICO(`<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>`),
  listSm:ICO(`<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>`).replace('width="20"','width="14"').replace('height="20"','height="14"'),
  cart:ICO(`<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>`),
  cam:ICO(`<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>`),
  copy:ICO(`<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>`),
  rcpt:ICO(`<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>`),
  close:ICO(`<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>`),
  back:ICO(`<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>`),
  plus:ICO(`<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>`)
};

icons.mic=ICO(`<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>`);
icons.mute=ICO(`<path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`);
icons.unmute=ICO(`<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>`);
icons.backSm=ICO(`<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>`).replace('width="20" height="20"','width="16" height="16"');
icons.star=ICO(`<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>`);

/* === CAMERON FEATURES v1 === */
/* === CAMERON FEATURES v2 PHOTO TILES === */

const MORE_MEALS=C.MORE_MEALS||[];
const SIDE_PAIRINGS=C.SIDE_PAIRINGS||{};
let EXTRA_MEALS=[]; // appended from MORE_MEALS

/* ---- Side photo tiles ---- */
const SIDE_SLUG={
  "Steamable green beans":"green-beans","Broccoli":"broccoli","Corn on the cob":"corn-cob",
  "Grilled zucchini or peppers":"zucchini-peppers","Caesar salad kit":"caesar-salad",
  "Baby carrots + ranch":"carrots-ranch","Asparagus":"asparagus","Baked / microwave potato":"baked-potato",
  "Sweet potato":"sweet-potato","Microwave rice cups / Ready Rice":"rice","Mac & cheese":"mac-cheese",
  "Garlic bread / Texas toast":"garlic-bread","Baked beans":"baked-beans","Pasta salad (deli)":"pasta-salad",
  "Tortillas":"tortillas","Potato salad":"potato-salad","Frozen tater tots / air-fryer fries":"fries",
  "Cottage cheese":"cottage-cheese","Deli coleslaw":"coleslaw","Chips & salsa":"chips-salsa",
  "Fruit cup":"fruit-cup","Yogurt":"yogurt","Banana / fruit":"banana-fruit","Potato chips":"potato-chips"
};
const SIDE_EMOJI={
  "Steamable green beans":"🫛","Broccoli":"🥦","Corn on the cob":"🌽","Grilled zucchini or peppers":"🥒",
  "Caesar salad kit":"🥗","Baby carrots + ranch":"🥕","Asparagus":"🌿","Baked / microwave potato":"🥔",
  "Sweet potato":"🍠","Microwave rice cups / Ready Rice":"🍚","Mac & cheese":"🧀","Garlic bread / Texas toast":"🍞",
  "Baked beans":"🫘","Pasta salad (deli)":"🍝","Tortillas":"🫓","Potato salad":"🥔",
  "Frozen tater tots / air-fryer fries":"🍟","Cottage cheese":"🥛","Deli coleslaw":"🥬","Chips & salsa":"🌮",
  "Fruit cup":"🍎","Yogurt":"🫙","Banana / fruit":"🍌","Potato chips":"🥔"
};
function sideSlug(n){
  if(SIDE_SLUG[n])return SIDE_SLUG[n];
  return String(n||"").toLowerCase().replace(/&/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function sideEmoji(n){return SIDE_EMOJI[n]||"🍽️"}
function sideImgSrc(n){return "img/sides/"+sideSlug(n)+".webp"}
function sideTileHTML(n, opts={}){
  const on=!!opts.on, capped=!!opts.disabled, day=opts.day, dataAttr=opts.dataAttr||"data-addside";
  const emo=sideEmoji(n);
  const dayAttr=day!=null?` data-day="${day}"` : "";
  return `<button type="button" class="side-tile${on?" is-on":""}" ${dataAttr}="${esc(n)}"${dayAttr} aria-pressed="${on}" ${capped?"disabled":""}>
    <span class="st-ph"><img src="${sideImgSrc(n)}" alt="" loading="lazy" decoding="async" onerror="this.closest('.side-tile').classList.add('no-img')"><span class="st-emo" aria-hidden="true">${emo}</span></span>
    <span class="st-name">${esc(n)}</span>
  </button>`;
}
function sidesGridHTML(names, activeSet, dayIdx){
  return `<div class="sides-grid">${names.map(n=>{
    const on=activeSet.has?activeSet.has(n):!!activeSet[n]||(Array.isArray(activeSet)&&activeSet.includes(n));
    const capped=!on&&dayIdx!=null&&sideCountInWeek(n,dayIdx)>=2;
    return sideTileHTML(n,{on,disabled:capped,day:dayIdx,dataAttr:dayIdx!=null?"data-addside":"data-x"});
  }).join("")}</div>`;
}

/* ---- Custom meals (full cards, persisted) ---- */
const CUS_KEY="cameron-meals-custom-v1";
function loadCustomMeals(){
  try{const j=JSON.parse(localStorage.getItem(CUS_KEY)||"[]");return Array.isArray(j)?j.filter(m=>m&&m.id&&m.name):[]}catch(_){return []}
}
function saveCustomMeals(){try{localStorage.setItem(CUS_KEY,JSON.stringify(CUSTOM_MEALS))}catch(_){}}
let CUSTOM_MEALS=loadCustomMeals();
function buildMealFromName(name){
  const q=String(name||"").trim(); if(!q)return null;
  const ql=q.toLowerCase();
  const pool=[...MEALS,...MORE_MEALS,...CUSTOM_MEALS,...EXTRA_MEALS];
  const hit=pool.find(m=>m.name&&m.name.toLowerCase()===ql)||pool.find(m=>m.name&&m.name.toLowerCase().includes(ql));
  const id="c_"+sideSlug(q).slice(0,28)+"_"+Date.now().toString(36).slice(-4);
  if(hit){
    return {id,name:q,emoji:hit.emoji||"🍽️",tag:hit.tag||(hit.bf?"Breakfast":hit.grab?"Lunch":"Dinner"),
      prep:hit.prep||10,cook:hit.cook||8,nut:hit.nut?{...hit.nut}:null,grill:!!hit.grill,bf:!!hit.bf,bfKey:hit.bfKey,
      grab:!!hit.grab,time:hit.time||"about 10–15 min",temp:hit.temp||"cook to safe temp",
      grill:hit.grill?hit.grill.slice():["Cook on Foreman or skillet until done."],
      stove:hit.stove?hit.stove.slice():["Cook in a skillet until done."],custom:true,fromId:hit.id};
  }
  const tag=/oat|bagel|egg|breakfast|yogurt|scramble|omelette|toast/i.test(q)?"Breakfast":/salad|sandwich|wrap|melt|taco|lunch/i.test(q)?"Lunch":"Dinner";
  return {id,name:q,emoji:tag==="Breakfast"?"🍳":tag==="Lunch"?"🥪":"🍽️",tag,prep:8,cook:8,nut:null,grill:true,custom:true,
    time:"about 10–15 min",temp:"165°F poultry · 160°F ground · 145°F steak/pork + rest",
    grill:["Season. Cook on your Foreman or skillet to a safe temp.","Rest a few minutes; plate with a side."],
    stove:["Cook in a skillet until done."]};
}

function foodCatalog(){
  const set=new Set(FOOD_WORDS);
  allMeals().forEach(m=>{if(m.name)set.add(m.name);(m.v||[]).forEach(v=>set.add(v))});
  allCatalogSides().forEach(n=>set.add(n));
  Object.values(C.PRICES||{}).forEach(p=>{if(p&&p.n)set.add(p.n)});
  SIDE_GROUPS.forEach(g=>g.items.forEach(it=>set.add(it.n)));
  return [...set];
}
function acSuggest(q,limit=8){
  q=String(q||"").trim().toLowerCase(); if(q.length<1)return [];
  const all=foodCatalog();
  const pref=[], sub=[];
  for(const w of all){
    const l=w.toLowerCase();
    if(l.startsWith(q))pref.push(w);
    else if(q.length>=2&&l.includes(q))sub.push(w);
    if(pref.length>=limit)break;
  }
  return [...pref,...sub].slice(0,limit);
}
function bindAutocomplete(input,onPick){
  if(!input||input._acBound)return; input._acBound=1;
  let wrap=input.closest(".ac-wrap");
  if(!wrap){wrap=document.createElement("div");wrap.className="ac-wrap";input.parentNode.insertBefore(wrap,input);wrap.appendChild(input)}
  let list=null, idx=-1;
  const close=()=>{if(list){list.remove();list=null}idx=-1};
  const pick=v=>{input.value=v;close();if(onPick)onPick(v);input.focus()};
  const draw=()=>{
    const items=acSuggest(input.value);
    close();
    if(!items.length||document.activeElement!==input)return;
    list=document.createElement("div");list.className="ac-list";list.setAttribute("role","listbox");
    items.forEach((t,i)=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.setAttribute("role","option");
      b.onmousedown=e=>{e.preventDefault();pick(t)};list.appendChild(b)});
    wrap.appendChild(list);
  };
  input.addEventListener("input",draw);
  input.addEventListener("keydown",e=>{
    if(e.key==="Escape"){close();return}
    if(!list)return;
    const buttons=[...list.querySelectorAll("button")];
    if(e.key==="ArrowDown"){e.preventDefault();idx=Math.min(buttons.length-1,idx+1);buttons.forEach((b,i)=>b.setAttribute("aria-selected",i===idx?"true":"false"))}
    else if(e.key==="ArrowUp"){e.preventDefault();idx=Math.max(0,idx-1);buttons.forEach((b,i)=>b.setAttribute("aria-selected",i===idx?"true":"false"))}
    else if(e.key==="Enter"&&idx>=0&&buttons[idx]){e.preventDefault();pick(buttons[idx].textContent)}
  });
  input.addEventListener("blur",()=>setTimeout(close,150));
}
function wireAllAutocomplete(root){
  (root||document).querySelectorAll("input#cin, input#own, input#cbrand, input[data-sloc], .addrow input, .ab-grid input#abName").forEach(inp=>{
    if(inp.type==="number"||inp.type==="file")return;
    if(/age|weight|height|ft|inch|lb|budget|amt|days/i.test(inp.id||inp.placeholder||""))return;
    bindAutocomplete(inp);
  });
}

/* ---- Sides on day cards ---- */
function fixedSidesForMeal(id){
  if(!id)return [];
  const raw=SIDE_PAIRINGS[id]||[];
  return raw.filter(n=>allCatalogSides().includes(n)||SIDES.includes(n)||n);
}
function sideCountInWeek(name,exceptIdx){
  if(!W)return 0;
  const days=effDays(W.ov);
  let n=0;
  days.forEach((d,i)=>{
    if(i===exceptIdx||d.kind==="hol"||d.kind==="rm"||d.kind==="out")return;
    if(d.sideName===name)n++;
    (d.extraSides||[]).forEach(s=>{if(s===name)n++});
  });
  return n;
}
function dayActiveSides(d){
  const out=[];
  if(d.sideName)out.push(d.sideName);
  (d.extraSides||[]).forEach(s=>{if(!out.includes(s))out.push(s)});
  return out;
}
function likedSidesForDay(d,exclude){
  const ex=new Set(exclude||[]);
  const out=[], seen=new Set();
  const rates=getRates();
  Object.keys(rates).forEach(id=>{
    const r=rates[id]; if(!r||(r.r!==1&&r.r!==2))return;
    (Array.isArray(r.sides)?r.sides:[]).forEach(n=>{
      if(n&&!ex.has(n)&&!seen.has(n)){seen.add(n);out.push(n)}
    });
  });
  return out.slice(0,8);
}
function applySideToDay(dayIdx, sideName){
  if(!W||!sideName)return;
  const base=W.base[dayIdx];
  const ov=W.ov[dayIdx];
  const cur=ov?{...effDays(W.ov)[dayIdx]}:null;
  // work on override or mutate base via override copy
  const src=effDays(W.ov)[dayIdx];
  const active=dayActiveSides(src);
  const on=active.includes(sideName);
  let sideNameNew=src.sideName, extra=[...(src.extraSides||[])];
  if(on){
    if(sideNameNew===sideName)sideNameNew=extra.shift()||null;
    else extra=extra.filter(s=>s!==sideName);
  }else{
    if(sideCountInWeek(sideName,dayIdx)>=2){toast("That side is already on twice this week");return}
    if(!sideNameNew)sideNameNew=sideName;
    else if(!extra.includes(sideName))extra.push(sideName);
  }
  // store as override preserving meal
  const keep={t:"side",sideName:sideNameNew,extraSides:extra,meal:src.meal,e:src.e,dinner:src.dinner,note:src.note,g:src.g,cut:src.cut,bf:src.bf,grab:src.grab,cook:src.cook,kind:src.kind,hol:src.hol,lunch:src.lunch};
  // Prefer mutating ov with side fields merged into existing ov or base-shadow
  if(W.ov[dayIdx]&&W.ov[dayIdx].t&&W.ov[dayIdx].t!=="side"){
    W.ov[dayIdx]={...W.ov[dayIdx],sideName:sideNameNew,extraSides:extra};
  }else if(W.ov[dayIdx]&&W.ov[dayIdx].t==="side"){
    W.ov[dayIdx]={...W.ov[dayIdx],sideName:sideNameNew,extraSides:extra};
  }else{
    // annotate base day directly so list builders see it
    W.base[dayIdx]={...W.base[dayIdx],sideName:sideNameNew,extraSides:extra};
    // also update dinner label if it embeds old side
  }
  // remember with rating
  if(src.meal){
    const all=getRates();
    if(all[src.meal]&&(all[src.meal].r===1||all[src.meal].r===2)){
      const sides=dayActiveSides({sideName:sideNameNew,extraSides:extra});
      all[src.meal]={...all[src.meal],sides};
      try{localStorage.setItem(RKEY,JSON.stringify(all))}catch(_){}
    }
  }
  if(W){W.daySides=W.daySides||{};const xs=dayActiveSides({sideName:sideNameNew,extraSides:extra});if(xs.length)W.daySides[dayIdx]=xs;else delete W.daySides[dayIdx]}
  recomputeList();renderWeek();
  toast(on?"Removed "+sideName:"Added "+sideName);
}
function sidesBlockHTML(d,i){
  if(d.kind==="hol"||d.kind==="rm"||d.kind==="out")return "";
  const fixed=fixedSidesForMeal(d.meal);
  const active=dayActiveSides(d);
  const liked=likedSidesForDay(d,[...fixed,...active]).filter(n=>!fixed.includes(n));
  if(!fixed.length&&!liked.length&&!active.length)return "";
  const actSet=new Set(active);
  return `<div class="sides-block" onclick="event.stopPropagation()">
    ${fixed.length?`<span class="sides-lbl">Suggested sides</span>${sidesGridHTML(fixed,actSet,i)}`:""}
    ${liked.length?`<span class="sides-lbl">From meals you liked</span>${sidesGridHTML(liked,actSet,i)}`:""}
  </div>`;
}

  if(document.body.classList.contains("light")){

    window.scrollTo(0,0);

function stopSpeak(){try{speechSynthesis.cancel()}catch(_){}}
function speak(text){
  if(welcomeMuted||!window.speechSynthesis)return;
  stopSpeak();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=1;u.pitch=1;
  try{speechSynthesis.speak(u)}catch(_){}
}
function hasSpeechRec(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function startMic(onText){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;
  r.onresult=ev=>{const t=ev.results[0]&&ev.results[0][0]&&ev.results[0][0].transcript;if(t)onText(t)};
  try{r.start()}catch(_){}
  return r;
}

function rotatePool(arr,seed,n){if(!arr.length)return [];const out=[];for(let i=0;i<n;i++)out.push(arr[(seed+i)%arr.length]);return out}

function sidesPool(){return allSides().filter(s=>st.sides.has(s))}
function assignSides(mon,n){
  const pool=sidesPool(); const out=[], cnt={}; const seed=Math.floor(mon.getTime()/86400000);
  if(!pool.length){for(let i=0;i<n;i++)out.push("Caesar salad kit");return out}
  let pi=0;
  for(let d=0;d<n;d++){let picked=null,tries=0;
    while(tries<pool.length*2){const s=pool[(seed+d+pi+tries)%pool.length];cnt[s]=cnt[s]||0;
      if(cnt[s]<2){cnt[s]++;picked=s;break}tries++}
    if(!picked)picked=pool[(d+seed)%pool.length];
    out.push(picked);pi++}
  return out;
}

/* ---- calories (USDA-based est., round to 10; Other → ?) ---- */
const PROTEIN_CAL=C.PROTEIN_CAL||{};
const round10=n=>n==null||!isFinite(n)?null:Math.round(n/10)*10;
const calTxt=n=>n==null?"cal: ?":`🔥 ~${round10(n)} cal`;
function proteinCal(name){if(!name)return null;return PROTEIN_CAL[name]!=null?PROTEIN_CAL[name]:null}
function mealBaseCal(id,cut){const m=M(id);if(!m)return null;if(m.grab)return m.nut&&m.nut.kcal!=null?m.nut.kcal:null;
  if(id==="burger"){const p=cut||pattyAll()[0];const pc=proteinCal(p);return pc!=null?pc:(m.nut&&m.nut.kcal)}
  if(m.protein){const c=cut||mv(id);const pc=proteinCal(c);return pc!=null?pc:(m.nut&&m.nut.kcal)}
  return m.nut&&m.nut.kcal!=null?m.nut.kcal:null}
function buildExtrasCal(mid){
  const ADD={cheese:70,cheeseslice:70,bacon:60,avocado:80,bun:120,egg:70,mayo:50,bbq:30,sauce:30,butter:50,sour:50,shred:70,lettuce:5,tomato:10,onion:10,pickles:5,ketchup:15,mustard:10,hot:5,salsa:15,rice:210,wrap:140,tortilla:140,bread:80,op:40,gonion:30,mushroom:20,jal:5,jalapeno:5,avo:80,guac:80,beans:110,corn:70,broccoli:50,top:20,veg:60,blue:70,horse:10,relish:15,kraut:20,pick:5};
  const B=BUILDS[mid]; if(!B||!st.build[mid]) return {cal:0,unk:false};
  let cal=0, unk=false; const T=st.build[mid].top;
  [...B.core,...B.extras].forEach(t=>{if(!T[t.id]||!T[t.id].on)return;
    if(t.protein||t.id==="patty"||t.id==="meat"||t.id==="done"||t.id==="season"||t.id==="marinade"||t.id==="eggs")return;
    if(ADD[t.id]!=null)cal+=ADD[t.id]; else if(t.k&&ADD[t.k]!=null)cal+=ADD[t.k];});
  (st.build[mid].custom||[]).forEach(()=>{unk=true});
  return {cal,unk};
}
function sideCal(name){const m=sideMeta(name);if(m.custom&&m.kcal==null)return null;return m.kcal!=null?m.kcal:null}
function mealTotalCal(mid, cutOverride){
  const m=M(mid); if(!m)return {cal:null,unk:true,label:"This meal: cal: ?"};
  if(m.grab){const c=m.nut&&m.nut.kcal;return {cal:c,unk:false,label:c==null?"This meal: cal: ?":`This meal: ~${round10(c)} cal`}}
  let base=mealBaseCal(mid, cutOverride), unk=false;
  if(base==null)unk=true;
  const ex=buildExtrasCal(mid); if(ex.unk)unk=true;
  if(base==null&&!ex.cal)return {cal:null,unk:true,label:"This meal: cal: ?"};
  const total=(base||0)+ex.cal;
  return {cal:total,unk,label:`This meal: ~${round10(total)} cal${unk?" · some cal: ?":""}`};
}
function dayCalTotal(d){
  if(d.kind==="hol"||d.kind==="rm"||d.kind==="out")return null;
  let total=0, unk=false;
  if(d.meal){const t=mealTotalCal(d.meal, d.cut); if(t.cal==null)unk=true; else total+=t.cal; if(t.unk)unk=true}
  else unk=true;
  dayActiveSides(d).forEach(sn=>{const sc=sideCal(sn);if(sc==null)unk=true;else total+=sc});
  if(d.bf){if(d.bf.kcal==null)unk=true;else total+=d.bf.kcal}
  if(unk&&!total)return {cal:null,unk:true};
  return {cal:total,unk};
}
function dayCalHTML(d){
  const t=dayCalTotal(d); if(!t)return "";
  const g=guideFor(st.about||{});
  let line=t.cal==null?`🍽 Dinner est. cal: ?`:`🍽 Dinner est. ~${round10(t.cal)} cal`;
  if(g&&t.cal!=null){const pct=Math.round(t.cal/g.mid*100);line+=` · ~${pct}% of your ~${g.lo.toLocaleString()}–${g.hi.toLocaleString()} guide`}
  return `<p class="nut">${line}${t.unk?" · some cal: ?":""}</p>`;
}
const mealTotalHTML=mid=>`<div class="mtot">${esc(mealTotalCal(mid).label)}</div>`;

const RULES_KEY="cameron-meals-rules-v1", SET_KEY="cameron-meals-settings-v1", HOL_KEY="cameron-meals-holidays-v1";
function getRules(){try{const j=JSON.parse(localStorage.getItem(RULES_KEY)||"null");if(Array.isArray(j)&&j.length)return j}catch(_){}
  return (C.DEFAULT_RULES||[]).slice()}
function setRules(arr){try{localStorage.setItem(RULES_KEY,JSON.stringify(arr))}catch(_){}}
function getHolCook(){try{const j=JSON.parse(localStorage.getItem(HOL_KEY)||"{}");return j&&typeof j==="object"?j:{}}catch(_){return {}}}
function setHolCook(o){try{localStorage.setItem(HOL_KEY,JSON.stringify(o))}catch(_){}}
function easterDate(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  month=Math.floor((h+l-7*m+114)/31)-1,day=((h+l-7*m+114)%31)+1;return new Date(y,month,day)}
function nthWeekday(y,month,weekday,n){
  if(n>0){const d=new Date(y,month,1);let c=0;while(d.getMonth()===month){if(d.getDay()===weekday){c++;if(c===n)return new Date(d)}d.setDate(d.getDate()+1)}}
  else{const d=new Date(y,month+1,0);while(d.getMonth()===month){if(d.getDay()===weekday)return new Date(d);d.setDate(d.getDate()-1)}}
  return null}
function holidaysInWeek(mon){
  const y=mon.getFullYear(), list=[], add=(dt,id,name)=>{if(dt&&dt>=mon&&dt<addDays(mon,7))list.push({date:new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()),id,name})};
  add(new Date(y,0,1),"nyd","New Year's Day"); add(new Date(y,6,4),"july4","July 4");
  add(new Date(y,11,24),"xmasEve","Christmas Eve"); add(new Date(y,11,25),"xmas","Christmas Day");
  add(nthWeekday(y,10,4,4),"thanks","Thanksgiving"); add(nthWeekday(y,4,1,-1),"mem","Memorial Day");
  add(nthWeekday(y,8,1,1),"labor","Labor Day"); add(easterDate(y),"easter","Easter");
  if(mon.getMonth()===11)add(new Date(y+1,0,1),"nyd","New Year's Day");
  return list;
}
function holidayOn(date){return holidaysInWeek(mondayOf(date)).find(h=>sameDay(h.date,date))||null}
function isHolidayOff(date){const h=holidayOn(date);if(!h)return null;return getHolCook()[h.id]?null:h}

function syncBreakfastFromMeals(){
  const set=getSettings(); let changed=false;
  allMeals().filter(m=>m.bf&&st.meals[m.id]==="yes"&&m.bfKey).forEach(m=>{
    if(set.bfWeekday==="oatmeal"||set.bfWeekday==="overnight"){set.bfWeekday="cereal";changed=true}
    // Treat Yes breakfast meals as available options; prefer first Yes bf as weekday if user picked one
  });
  const yesBf=allMeals().filter(m=>m.bf&&st.meals[m.id]==="yes"&&m.bfKey);
  if(yesBf.length){
    const keys=yesBf.map(m=>m.bfKey);
    if(!keys.includes(set.bfWeekday)){set.bfWeekday=keys[0];changed=true}
    if(keys.includes("bec")){set.bfWeekend="bec";changed=true}
    else if(keys.length>1&&!keys.includes(set.bfAlt)){set.bfAlt=keys.find(k=>k!==set.bfWeekday)||set.bfAlt;changed=true}
  }
  if(changed)setSettings(set);
}

const SHUFFLE_PREV_KEY="cameron-meals-shuffle-prev-v1";
function shuffleWeek(){
  // Self-check: uniqueness — used[] + while(used.includes) skip duplicates; SHUFFLE_PREV_KEY avoids immediate repeat set.
  if(!W){toast("Finish setup first");return}
  const days=effDays(W.ov);
  const pool=allMeals().filter(m=>!m.bf&&!m.grab&&m.id!=="veg"&&rateOf(m.id)!==-1);
  // Prefer yes + favorites, then MORE_MEALS
  const more=(typeof MORE_MEALS!=="undefined"?MORE_MEALS:[]).filter(m=>!m.bf&&rateOf(m.id)!==-1&&!pool.find(p=>p.id===m.id));
  let candidates=[...pool.filter(m=>yes(m.id)||rateOf(m.id)===2),...pool,...more];
  // unique by id
  const seen=new Set(); candidates=candidates.filter(m=>{if(seen.has(m.id))return false;seen.add(m.id);return true});
  let prev=[]; try{prev=JSON.parse(localStorage.getItem(SHUFFLE_PREV_KEY)||"[]")}catch(_){prev=[]}
  const prevSet=new Set(prev);
  let fresh=candidates.filter(m=>!prevSet.has(m.id));
  if(fresh.length<5)fresh=candidates.slice();
  // shuffle
  for(let i=fresh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fresh[i],fresh[j]]=[fresh[j],fresh[i]]}
  const fillable=days.map((d,i)=>({d,i})).filter(x=>x.d.kind!=="hol");
  const used=[];
  let fi=0;
  fillable.forEach(({d,i})=>{
    // Keep ❤️ favorite locked pick
    if(d.meal&&rateOf(d.meal)===2&&W.ov[i]&&W.ov[i].t==="pick"){used.push(d.meal);return}
    // Keep eat-out / removed
    if(W.ov[i]&&(W.ov[i].t==="out"||W.ov[i].t==="rm"))return;
    let m=fresh[fi++];
    while(m&&used.includes(m.id))m=fresh[fi++];
    if(!m){m=candidates.find(x=>!used.includes(x.id));}
    if(!m)return;
    used.push(m.id);
    const side=(typeof assignSides==="function"?null:null);
    const sideName=d.sideName||(W.daySides&&W.daySides[i]&&W.daySides[i][0])||null;
    const cut=m.protein?fixNextCut(m.id==="burger"?"burger":MG[m.id]||m.id,{}):null;
    const title=mealTitle(m.id,cut)||m.name;
    W.ov[i]={t:"pick",meal:m.id,e:m.emoji,dinner:sideName?title+" + "+sideName:title,cut:cut||null,cook:!!m.grill||!m.grab,note:m.time?("⏱ "+m.time):"",lunch:d.lunch||"Lunch on your own",sideName,g:MG[m.id]||null,kind:null};
  });
  // Refresh breakfasts from plan (cereal etc.) — keep bf on days
  const bfs=planBreakfast(weekStartDate());
  fillable.forEach(({i})=>{if(W.ov[i])W.ov[i].bf=bfs[i]});
  try{localStorage.setItem(SHUFFLE_PREV_KEY,JSON.stringify(used))}catch(_){}
  recomputeList();renderWeek();toast("Week shuffled — list & budget updated");
}

  const favN=g=>Object.keys(MG).filter(id=>MG[id]===g&&rateOf(id)===2).length;

  const F=["burger","chicken","brats","pork"].find(g=>groups.includes(g));

  const cutUsed={};

function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}

function parseWeekLabel(str){

function longPress(el,fn,ms){ms=ms||500;let t=null,x=0,y=0,fired=false;

  const cancel=()=>{clearTimeout(t);t=null};

function isoD(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}

function coffeeBrandName(){const c=st.coffee;return c.brand==="Other"?(c.brandOther||"Other coffee"):(c.brand||"Lavazza Qualità Oro")}
function coffeeCalc(){
  const K=C.COFFEE,c=st.coffee,P=C.PRICES;
  const ds=K.drinks.filter(d=>c.drinks.has(d.id));const list=ds.length?ds:[K.drinks[0]];
  const n=c.perWeek||7, gPerShot=K.gPerShot||7, g=n*gPerShot, bags=Math.max(1,Math.ceil(g/(K.bagG||250)));
  const avgMilk=c.milk==="No milk"?0:list.reduce((a,d)=>a+(d.milk||0),0)/list.length;
  const milkOz=Math.round(n*avgMilk), milkKey=milkOz>0&&P["coffee:"+c.milk]?"coffee:"+c.milk:null;
  const halfGal=milkKey?Math.max(1,Math.ceil(milkOz/K.milkOz)):0;
  const bagLine=`${bags} × ${K.bagLabel||"large can/bag"} (~${g} g/wk at ${gPerShot} g/shot)`;
  // Per-cup cost only if we have a receipt/est price; otherwise prompt add-from-receipt
  const bagPrice=P["coffee:oro"]&&(P["coffee:oro"].p!=null||P["coffee:oro"].a!=null)?Math.min(P["coffee:oro"].p??1e9,P["coffee:oro"].a??1e9):null;
  const cupsPerBag=bagPrice!=null?Math.max(1,Math.floor((K.bagG||250)/gPerShot)):null;
  const perCup=bagPrice!=null&&cupsPerBag?bagPrice/cupsPerBag:null;
  const milkCost=milkKey?milkOz/K.milkOz*Math.min(P[milkKey].a,P[milkKey].p):0;
  const home=perCup!=null?perCup*n+milkCost:null;
  const out=n*K.outPrice;
  const needLids=st.equip.has("nespresso"); // periodic restock always offered when Nespresso is on
  return {n,g,gPerShot,bags,bagLine,brandName:coffeeBrandName(),milkOz,milkKey,halfGal,perCup,home,out,save:home!=null?out-home:null,needLids,cupsPerBag,bagPrice};
}
function coffeeDesc(){const K=C.COFFEE,c=st.coffee;const ds=K.drinks.filter(d=>c.drinks.has(d.id)).map(d=>d.label);
  const ms=[...c.machines||st.equip].filter(id=>id==="lavazza"||id==="nespresso").map(id=>(K.machines.find(m=>m.id===id)||{}).label||id);
  const gear=ms.length?ms.join(" · "):[...st.equip].filter(id=>id==="lavazza"||id==="nespresso").map(id=>(K.machines.find(m=>m.id===id)||{label:id}).label).join(" · ");
  return `${esc(coffeeBrandName())} · ${esc(gear||"espresso")} · ${esc(ds.join(", ")||"Espresso")}${c.milk&&c.milk!=="No milk"?" · "+esc(c.milk):""} · ${c.perWeek} drinks/week`}

function migratePhotoVal(v){
  if(Array.isArray(v))return v.filter(x=>typeof x==="string"&&x);

function loadCamPhotos(){

function compressImageFile(file,maxW,quality){
  maxW=maxW||1100;quality=quality==null?0.7:quality;
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h){URL.revokeObjectURL(url);resolve(null);return}
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,h);
        const out=c.toDataURL("image/jpeg",quality);
        URL.revokeObjectURL(url);resolve(out);
      }catch(err){URL.revokeObjectURL(url);reject(err)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("img"))};
    img.src=url;
  });
}
async function appendSectionPhotos(sectionId,fileList){
  const map=loadCamPhotos();
  const arr=(map[sectionId]||[]).slice();
  const files=[...fileList].filter(f=>f&&f.type&&f.type.startsWith("image/"));
  for(const f of files){
    try{
      let data=await compressImageFile(f);
      if(!data){const r=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)});data=r}
      arr.push(data);
    }catch(_){}
  }
  map[sectionId]=arr;
  if(!saveCamPhotos(map))return false;
  return true;
}
function removeSectionPhoto(sectionId,idx){
  const map=loadCamPhotos();

  if(idx<0||idx>=arr.length)return;

async function decompressPayload(raw){

      <p class="welcome-sub">Pre-set baseline: <b>${esc(list)}</b>. No George Foreman grill or coffee machines — add those in Settings if you have them.</p>
      <div class="welcome-opts">
        <button type="button" class="welcome-opt primary" data-ok="1">Looks good</button>
        <button type="button" class="welcome-opt" data-set="1">Review settings</button>
      </div>`;
    box.querySelector("[data-ok]").onclick=finish;
    box.querySelector("[data-set]").onclick=()=>{finish();openSettings()};
  };
  drawName();
}
