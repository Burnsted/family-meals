<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cameron's Meal Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--chip:#334155;--on:#0ea5e9;--gold:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
  .wrap{width:100%;max-width:440px;padding:20px 16px 40px}
  .top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin-bottom:10px}
  .bar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;background:var(--on);transition:width .3s}
  .card{background:var(--card);border-radius:18px;padding:22px 18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .emoji{font-size:64px;line-height:1;margin:4px 0 10px}
  h1{font-size:24px;margin:0 0 6px}
  p.sub{color:var(--mut);margin:0 0 18px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:4px 0 20px}
  .chip{border:2px solid var(--on);background:var(--on);color:#fff;border-radius:999px;padding:10px 14px;font-size:16px;cursor:pointer;user-select:none}
  .chip.off{background:transparent;color:var(--ink);border-color:var(--chip)}
  .chip.drop.off{color:var(--mut);text-decoration:line-through}
  .chip.main{background:var(--gold);border-color:var(--gold)}
  .chip.open{outline:3px solid var(--gold);outline-offset:2px}
  .chip.addc{background:transparent;border:2px dashed var(--mut);color:var(--mut)}
  .chip.cust:not(.off){background:#8b5cf6;border-color:#8b5cf6}
  .next{width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:var(--on);color:#fff;cursor:pointer}
  .next:disabled{opacity:.4}
  .ghost{background:transparent;color:var(--mut);font-weight:500;font-size:15px;margin-top:8px;padding:10px}
  .addrow{display:flex;gap:8px;margin:0 0 18px}
  .addrow input{flex:1;min-width:0;border-radius:12px;border:2px solid var(--chip);background:#0b1222;color:var(--ink);padding:12px;font-size:16px}
  .addrow button{border:0;border-radius:12px;background:var(--chip);color:#fff;padding:0 16px;font-size:16px;cursor:pointer}
  .addrow.cust input{border-color:#8b5cf6}.addrow.cust button{background:#8b5cf6}
  .photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:0 0 18px}
  .ph{position:relative;aspect-ratio:3/4;border:2px dashed var(--chip);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;font-size:14px;color:var(--mut)}
  .ph span.big{font-size:34px;margin-bottom:6px}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph.done{border:2px solid var(--on)}
  .ph .ok{position:absolute;bottom:6px;left:6px;right:6px;background:rgba(14,165,233,.9);color:#fff;border-radius:8px;padding:3px;font-size:12px}
  .ph input{display:none}
  .sum{text-align:left}
  .sum h2{font-size:17px;margin:16px 0 6px}
  .sum p{margin:0}
  .tag{display:inline-block;background:var(--chip);border-radius:999px;padding:4px 10px;margin:3px;font-size:14px}
  .tag.y{background:#065f46}
  .no{color:var(--mut);font-size:14px}
  .muted{color:var(--mut);font-size:13px;margin-top:16px}
  /* variant pop list */
  .pop{background:#0b1222;border:2px solid var(--gold);border-radius:16px;padding:12px;margin:-8px 0 18px;text-align:left;animation:pop .15s ease}
  .pop .ph2{font-size:14px;color:var(--gold);font-weight:700;margin:0 0 8px}
  .pop .opts{display:flex;flex-wrap:wrap;gap:8px}
  .popt{border:2px solid var(--chip);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px;cursor:pointer}
  .popt.sel{background:var(--on);border-color:var(--on);color:#fff}
  .popt.rm{border-color:#7f1d1d;color:#fca5a5}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
  /* equipment */
  .feat{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--chip);border-radius:18px;padding:14px;margin:0 0 8px;cursor:pointer;background:#0b1222}
  .feat.on{border-color:var(--gold);background:linear-gradient(135deg,#3b2a06,#1e293b)}
  .feat .fe{font-size:40px}
  .feat b{font-size:18px}
  .feat .dad{color:var(--gold);font-size:14px;margin-top:3px}
  .feat .ck{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--chip);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .feat.on .ck{background:var(--gold);border-color:var(--gold);color:#111}
  .fnote{font-size:13px;color:var(--mut);margin:0 0 16px}
  .lbl{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 8px}
  /* meals yes/no */
  .meals{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;text-align:left}
  .meal{background:#0b1222;border:2px solid var(--chip);border-radius:16px;padding:10px 12px}
  .meal.yes{border-color:#10b981}.meal.no{opacity:.55}
  .mrow{display:flex;align-items:center;gap:10px}
  .me{font-size:34px;line-height:1}
  .mt{flex:1;min-width:0}
  .mt b{font-size:16px}
  .vchip{display:inline-block;margin-top:4px;border:2px solid var(--gold);color:var(--gold);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
  .fb{display:inline-block;margin-top:4px;font-size:12px;color:#fbbf24}
  .yn{display:flex;gap:6px}
  .yn button{border:2px solid var(--chip);background:transparent;color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;cursor:pointer}
  .yn button.y.sel{background:#10b981;border-color:#10b981}
  .yn button.n.sel{background:#7f1d1d;border-color:#7f1d1d}
  .tipbtn{display:block;width:100%;margin-top:8px;border:0;background:transparent;color:var(--on);text-align:left;font-size:14px;padding:4px 0;cursor:pointer}
  .tip{margin-top:6px;background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
  .tip ol{margin:6px 0;padding-left:20px}
  .tip .t1{color:#fbbf24;font-weight:700}
  .tip .t2{color:#f87171;font-weight:700}
  .tip .t3{color:var(--mut);font-size:12px}
  details.box{background:#0b1222;border:2px solid var(--chip);border-radius:14px;padding:10px 12px;margin:0 0 16px;text-align:left}
  details.box summary{cursor:pointer;font-weight:700}
  details.box ul{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.45}
  .build{background:linear-gradient(135deg,#f59e0b,#d97706);font-size:22px;padding:20px;margin-top:18px;box-shadow:0 6px 0 rgba(146,64,14,.6)}
  /* ===== week planner (light, like Ted's family site) ===== */
  body.light{--wbg:#eef6f2;--wink:#173042;--wsoft:#3d5566;--teal:#0f6e6e;--tealD:#0a5555;--tealS:#d4efef;--coral:#d4572a;--coralD:#b9441c;--coralS:#ffe3d6;--wgold:#d9a441;--white:#fffaf4;
    background:radial-gradient(circle at 10% 0%,rgba(15,110,110,.16),transparent 38%),radial-gradient(circle at 95% 12%,rgba(212,87,42,.12),transparent 34%),linear-gradient(180deg,#f4faf7 0%,#eef6f2 42%,#f8f1e8 100%);color:var(--wink);font-family:Nunito,Segoe UI,sans-serif}
  #week{display:none;width:100%;max-width:460px;padding:14px 14px 50px}
  body.light #week{display:block} body.light .wrap{display:none}
  .wk-h{text-align:center;padding:4px 0 10px}
  .kick{margin:0;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tealD)}
  .brand{margin:2px 0 0;font-family:Fraunces,Georgia,serif;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
  .wlabel{display:inline-block;margin:10px 0 4px;border:2px solid var(--teal);background:var(--white);color:var(--coralD);font-weight:800;border-radius:14px;padding:8px 18px;box-shadow:0 4px 0 rgba(15,110,110,.16)}
  .tagline{margin:6px auto 0;color:var(--wsoft);font-weight:700;font-size:14px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
  .pill{font-weight:800;padding:7px 12px;border-radius:12px;font-size:14px}
  .pill.t{background:var(--tealS);color:var(--tealD)}.pill.c{background:var(--coralS);color:var(--coralD)}
  .rules{margin:6px 0 14px;padding:12px 14px;background:linear-gradient(135deg,#124f4f,var(--teal));color:#fff;border-radius:16px;box-shadow:0 8px 22px rgba(23,48,66,.12)}
  .rules h2{margin:0 0 6px;font-family:Fraunces,Georgia,serif;font-size:17px}
  .rules ul{margin:0;padding-left:18px;font-weight:650;font-size:13px;line-height:1.4}
  .rules li+li{margin-top:3px}
  .lt{background:var(--white);border:2px dashed rgba(212,87,42,.55);border-radius:16px;padding:10px 14px;margin:0 0 14px;box-shadow:0 8px 22px rgba(23,48,66,.12)}
  .lt summary{font-weight:800;color:var(--coralD);cursor:pointer;font-size:16px}
  .lt ul{margin:8px 0 0;padding-left:18px;font-weight:650;color:var(--wsoft);font-size:14px}
  .stitle{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 10px}
  .stitle h2{margin:0;font-family:Fraunces,Georgia,serif;font-size:22px}
  .stitle span{color:var(--wsoft);font-weight:700;font-size:13px}
  .day{background:var(--white);border-radius:16px;box-shadow:0 8px 22px rgba(23,48,66,.12);overflow:hidden;margin-bottom:12px;cursor:pointer;animation:pi .4s ease both}
  @keyframes pi{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1}}
  .dh{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--teal),var(--tealD));color:#fff;padding:9px 14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
  .day.cook .dh{background:linear-gradient(135deg,var(--coral),var(--coralD))}
  .db{padding:12px 14px 14px}
  .memo{font-size:36px;line-height:1;display:block;margin-bottom:4px}
  .dinner{margin:0;font-size:18px;font-weight:800}
  .dnote{margin:7px 0 0;padding:7px 10px;background:var(--coralS);border-radius:10px;color:var(--coralD);font-weight:800;font-size:14px}
  .day:not(.cook) .dnote{background:var(--tealS);color:var(--tealD)}
  .dl{margin:7px 0 0;font-weight:700;font-size:14px;color:var(--wink)}
  .dl.b{color:var(--wsoft);font-weight:650}
  .hint{margin:7px 0 0;color:var(--wsoft);font-size:12px;font-weight:700}
  .rec{margin-top:10px;padding:10px 12px;background:var(--wbg);border-left:5px solid var(--teal);border-radius:12px;font-size:14px;font-weight:650;color:var(--wsoft)}
  .rec h4{margin:0 0 4px;color:var(--tealD);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
  .rec ol{margin:0;padding-left:18px}
  .rec .t1{color:#b45309;font-weight:800}.rec .t2{color:#b91c1c;font-weight:800}.rec .t3{color:var(--wsoft);font-size:12px}
  .gpanel{background:var(--white);border-radius:20px;box-shadow:0 8px 22px rgba(23,48,66,.12);padding:14px;margin-bottom:16px}
  .tot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
  .tot div{background:var(--wbg);border-radius:12px;padding:8px 6px;text-align:center;font-weight:800;font-size:13px;color:var(--wsoft)}
  .tot b{display:block;font-size:19px;color:var(--wink)}
  .tot .best{background:var(--tealS);color:var(--tealD)}
  .tot .main{outline:2px solid var(--wgold)}
  .gnote{font-size:13px;font-weight:700;color:var(--wsoft);background:var(--coralS);border-radius:12px;padding:8px 10px;margin:0 0 6px}
  .aisle{margin:14px 0 4px;padding-bottom:3px;border-bottom:2px solid #dceee6;color:var(--tealD);font-size:16px;display:flex;justify-content:space-between}
  .aisle small{color:var(--wsoft);font-size:12px}
  .it{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px dashed rgba(23,48,66,.12)}
  .it .cb{width:26px;height:26px;border-radius:8px;border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;cursor:pointer}
  .it.ck .cb{background:var(--teal)}
  .it.ck .nm{text-decoration:line-through;opacity:.6}
  .nm{font-weight:800;font-size:15px;cursor:pointer}
  .nm small{display:block;font-weight:650;color:var(--wsoft);font-size:12px}
  .nm .src{color:var(--teal)}
  .pr{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;font-size:12px;font-weight:800}
  .pr span{white-space:nowrap}
  .pr span{padding:2px 6px;border-radius:8px;background:var(--wbg);color:var(--wsoft)}
  .pr span.win{background:#d1fae5;color:#065f46}
  .have{border:2px solid rgba(23,48,66,.15);background:#fff;border-radius:10px;padding:7px 8px;font-weight:800;font-size:12px;color:var(--wsoft);cursor:pointer;white-space:nowrap}
  .gone{opacity:.45}
  .gone .have{background:var(--wgold);color:var(--wink)}
  .gone .nm{text-decoration:line-through}
  .gh{display:block;background:#173042;color:#fff;border-radius:16px;padding:14px;text-decoration:none;margin:0 0 14px;box-shadow:0 8px 22px rgba(23,48,66,.18)}
  .gh b{font-size:16px}.gh span{display:block;font-size:13px;opacity:.85;margin-top:3px;font-weight:650}
  .wbtn{display:block;width:100%;border:0;border-radius:14px;min-height:52px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
  .wbtn.p{background:linear-gradient(160deg,var(--teal),var(--tealD));color:#fff}
  .wbtn.g{background:var(--white);color:var(--wink);border:2px solid rgba(23,48,66,.12)}
  .foot{text-align:center;color:var(--wsoft);font-weight:650;font-size:12px;margin-top:16px;line-height:1.5}
  .foot a{color:var(--teal)}

  /* ===== v3: receipt button, calendar, budget, week customizer, build extras, prep badges ===== */
  .rcpt-btn{border:0;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#111;font:inherit;font-weight:800;font-size:15px;padding:10px 16px;min-height:44px;cursor:pointer;box-shadow:0 4px 0 rgba(146,64,14,.45)}
  .rcpt-top{display:flex;justify-content:center;margin:0 0 12px}
  body.light .rcpt-btn{background:linear-gradient(135deg,var(--coral),var(--coralD));color:#fff;box-shadow:0 4px 0 rgba(185,68,28,.3)}
  .wl-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px}
  .wl-row .wlabel{margin:0}
  .cal-btn{width:48px;height:48px;border-radius:14px;border:2px solid var(--teal);background:var(--white);font-size:22px;cursor:pointer;box-shadow:0 4px 0 rgba(15,110,110,.16);flex-shrink:0}
  .pill.btn{border:0;font:inherit;font-weight:800;cursor:pointer;min-height:40px}
  .pill.bud{background:#fff;color:var(--tealD);border:2px solid rgba(15,110,110,.35)}
  .pill.bud.off{background:#eef1f3;color:#7a8a96;border-color:#d5dde2;font-weight:700}
  .bcmp{margin:8px auto 0;max-width:380px;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
  .bcmp.under{background:#d1fae5;color:#065f46}.bcmp.over{background:#fee2e2;color:#991b1b}
  .sheet-bg{position:fixed;inset:0;background:rgba(23,48,66,.55);display:none;align-items:flex-end;justify-content:center;z-index:60;padding:10px}
  .sheet-bg.open{display:flex}
  .sheet{width:100%;max-width:440px;max-height:88vh;overflow:auto;background:#fffaf4;color:#173042;border-radius:22px 22px 16px 16px;padding:14px 14px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3);font-family:Nunito,Segoe UI,sans-serif;animation:pop .2s ease}
  .sh-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .sh-top h3{margin:0;font-family:Fraunces,Georgia,serif;font-size:21px}
  .sh-x{width:44px;height:44px;border:0;border-radius:12px;background:#dceee6;color:#173042;font-size:20px;font-weight:800;cursor:pointer;flex-shrink:0}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 6px}
  .cal-nav b{font-size:18px}
  .cal-nav button{width:48px;height:44px;border:2px solid rgba(15,110,110,.3);border-radius:12px;background:#fff;font-size:20px;font-weight:800;color:#0a5555;cursor:pointer}
  .cal-dow,.cal-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-dow span{text-align:center;font-size:12px;font-weight:800;color:#3d5566;padding:4px 0;text-transform:uppercase}
  .cal-row{border-radius:12px;padding:2px 0;margin:1px 0}
  .cal-row.sel{background:#d4efef;box-shadow:inset 0 0 0 2px #0f6e6e}
  .cal-d{height:46px;border:0;background:transparent;border-radius:10px;font:inherit;font-weight:800;font-size:16px;color:#173042;cursor:pointer}
  .cal-d.out{color:#a0afb9;font-weight:650}
  .cal-d.today{background:#ffe3d6;color:#b9441c;box-shadow:inset 0 0 0 2px #d4572a}
  .cal-d:active{background:#0f6e6e;color:#fff}
  .cal-foot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
  .cal-foot button,.sh-btn{min-height:48px;border-radius:12px;border:2px solid rgba(15,110,110,.3);background:#fff;font:inherit;font-weight:800;font-size:14px;color:#0a5555;cursor:pointer}
  .cal-foot .now,.sh-btn.p{background:linear-gradient(160deg,#0f6e6e,#0a5555);color:#fff;border-color:transparent}
  .cal-sel{margin:0 0 6px;font-weight:800;color:#b9441c;font-size:14px}
  .sw{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eef6f2;border-radius:14px;padding:10px 12px;margin:4px 0 12px;cursor:pointer;font-weight:800}
  .sw .tg{width:58px;height:34px;border-radius:999px;background:#c5d0d6;position:relative;flex-shrink:0;transition:background .15s}
  .sw .tg::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
  .sw[aria-checked="true"] .tg{background:#0f6e6e}.sw[aria-checked="true"] .tg::after{left:27px}
  .fld{display:block;font-weight:800;font-size:14px;margin:8px 0 4px;color:#3d5566}
  .inp{width:100%;font:inherit;font-size:20px;font-weight:800;border:2px solid rgba(15,110,110,.35);border-radius:12px;padding:10px 12px;background:#fff;color:#173042}
  .dchips{display:flex;gap:6px;margin:8px 0 4px}
  .dchips button{flex:1;min-height:44px;border-radius:12px;border:2px solid rgba(15,110,110,.3);background:#fff;font:inherit;font-weight:800;color:#0a5555;cursor:pointer}
  .dchips button.on{background:#0f6e6e;color:#fff;border-color:#0f6e6e}
  .sh-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .muted2{font-size:12px;color:#3d5566;font-weight:650;margin:8px 0 0}
  .cz{border:2px solid rgba(23,48,66,.1);border-radius:14px;padding:8px 10px;margin:0 0 8px;background:#fff}
  .cz.mv{border-color:#d4572a;background:#fff5ef}
  .cz.ch{border-color:#0f6e6e}
  .cz-h{display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:#0a5555;text-transform:uppercase;letter-spacing:.03em}
  .cz-d{font-weight:800;font-size:15px;margin:2px 0 6px}
  .cz-o{display:flex;flex-wrap:wrap;gap:4px}
  .cz-o button{min-height:40px;border-radius:10px;border:2px solid rgba(15,110,110,.28);background:#eef6f2;font:inherit;font-weight:800;font-size:12.5px;color:#173042;padding:0 7px;cursor:pointer}
  .cz-o button.on{background:#0f6e6e;color:#fff;border-color:#0f6e6e}
  .cz-o button.mvb.on{background:#d4572a;border-color:#d4572a}
  .cz-list{display:flex;flex-direction:column;gap:5px;margin-top:6px}
  .cz-list button{text-align:left;min-height:42px;border-radius:10px;border:2px solid rgba(15,110,110,.2);background:#fff;font:inherit;font-weight:800;font-size:14px;padding:6px 10px;cursor:pointer}

<body>
<div class="wrap">
  <div class="rcpt-top"><button class="rcpt-btn" data-rcpt="1">📷 Upload receipt</button></div>
  <div class="top"><span>Cameron's Meal Picker</span><span id="count"></span></div>
  <div class="bar"><i id="prog" style="width:0"></i></div>
  <div class="card" id="card"></div>
  <p class="muted">Taps only (typing just for "Other store", "+ Custom" and About me). Photos stay on your phone unless you share them. About me, budget, ratings and your meal log are saved on this phone only; nothing is sent anywhere.</p>
</div>
<div id="week"></div>
<div class="toast2" id="toast2" role="status" aria-live="polite"></div>
<div class="sheet-bg" id="sheet" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true" id="sheetIn"></div></div>
<script src="meals.js"></script>
<script>
const C=window.CAM, STORES=C.STORES, BUILDS=C.BUILDS, SIDES=C.SIDES, DRILL=C.DRILL, MEALS=C.MEALS;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const M=id=>MEALS.find(m=>m.id===id);
let st, queue, pos;
function reset(){
  const build={};Object.keys(BUILDS).forEach(k=>{const b=BUILDS[k],o={};b.core.forEach(t=>o[t.id]={on:true,v:t.v?t.v[0]:t.label});b.extras.forEach(t=>o[t.id]={on:false,v:t.label});build[k]={top:o,custom:[]}});
  st={stores:new Set(),extra:[],main:"",photos:{},equip:new Set(["foreman","espresso"]),coffee:{drinks:new Set(["latte","iced"]),milk:"2%",syrup:"None",perWeek:7},meals:{},mealV:{},tip:null,
      build,xOpen:null,weekStart:null,about:getAbout(),aboutReturn:false,sides:new Set(),picks:{},custom:{},open:null,cOpen:null,mealCustom:[],kitPhotos:[]};
  queue=["photos","stores","main","about","equip","coffee","meals","MEALB","sides","BUILD","summary"]; pos=0;
  document.body.classList.remove("light");
}
const card=$("card");
function go(n=1){pos+=n;
  for(let g=0;g<50;g++){const s=queue[pos];
    if(s==="main"&&st.stores.size<2){if(st.stores.size===1)st.main=[...st.stores][0];pos+=n>0?1:-1;continue}
    if(s==="coffee"&&!st.equip.has("espresso")){pos+=n>0?1:-1;continue}
    if(s==="MEALB"){buildMealSteps();continue}
    if(s==="BUILD"){buildDrill();continue}
    break}
  st.open=null;st.cOpen=null;render();window.scrollTo(0,0)}
function buildMealSteps(){
  // ingredient screens: burger unless he said No; other meals only if he said Yes
  const ids=Object.keys(BUILDS).filter(k=>k==="burger"?st.meals.burger!=="no":st.meals[k]==="yes");
  queue.splice(pos,1,...ids.map(k=>({build:k})));
}
function buildDrill(){
  const steps=[];
  allSides().filter(s=>st.sides.has(s)&&DRILL[s]).forEach(s=>steps.push({side:s,level:"top"}));
  queue.splice(pos,1,...steps);
}
const allSides=()=>[...SIDES,...(st.custom.sides||[])];
function progress(){
  const total=queue.length-1;
  $("prog").style.width=Math.min(pos/total,1)*100+"%";
  $("count").textContent=queue[pos]==="summary"?"Done":`Step ${pos+1} of ${queue.length}`;
}
/* ---- chip helpers ---- */
function chipList(opts,set,cls="",ckey=null){
  const cust=ckey?(st.custom[ckey]||[]):[];
  return `<div class="chips">${[...opts,...cust].map(x=>`<span class="chip ${cls}${cust.includes(x)?" cust":""}${set.has(x)?"":" off"}" data-x="${esc(x)}">${esc(x)}</span>`).join("")}${ckey?customChip(ckey):""}</div>${ckey?customRow(ckey):""}`}
const customChip=k=>`<span class="chip addc" data-c="${esc(k)}">+ Custom</span>`;
const customRow=k=>st.cOpen===k?`<div class="addrow cust"><input id="cin" placeholder="Type your own…" maxlength="30" autocomplete="off"><button id="cadd">Add</button></div>`:"";
function bindChips(set,single=false){card.querySelectorAll(".chip[data-x]").forEach(c=>c.onclick=()=>{const x=c.dataset.x;if(single){set.clear();set.add(x)}else{set.has(x)?set.delete(x):set.add(x)}render()})}
/* custom: onAdd(value) */
function bindCustom(onAdd){
  card.querySelectorAll(".chip.addc").forEach(c=>c.onclick=()=>{st.cOpen=st.cOpen===c.dataset.c?null:c.dataset.c;st.open=null;render();const i=$("cin");if(i)i.focus()});
  const b=$("cadd");if(!b)return;
  const add=()=>{const v=$("cin").value.trim().slice(0,30);if(v){onAdd(st.cOpen,v)}st.cOpen=null;render()};
  b.onclick=add;$("cin").onkeydown=e=>{if(e.key==="Enter")add()};
}
function addCustomTo(set){return (k,v)=>{st.custom[k]=st.custom[k]||[];if(!st.custom[k].includes(v))st.custom[k].push(v);set.add(v)}}
function btns(label,disabled=false,skip=null){return `<button class="next" id="nx" ${disabled?"disabled":""}>${label}</button>${skip?`<button class="next ghost" id="sk">${skip}</button>`:""}`}
function popHTML(title,opts,cur,on){return `<div class="pop"><p class="ph2">${title}</p><div class="opts">${opts.map(v=>`<button class="popt${on&&cur===v?" sel":""}" data-v="${esc(v)}">${esc(v)}</button>`).join("")}${on?`<button class="popt rm" data-rm="1">✕ Remove</button>`:""}</div></div>`}
const tool=()=>st.equip.has("foreman")?"grill":(st.equip.has("stove")||st.equip.has("skillet"))?"stove":st.equip.has("airfryer")?"air":(st.equip.has("oven")||st.equip.has("sheet"))?"oven":"grill";
function tipHTML(m){
  const t=tool();let steps=t==="grill"?m.grill:t==="stove"?m.stove:
    t==="air"?["Air fryer 400°F. Chicken/chops about 10–14 min, burgers/steak about 8–10 min, flip halfway."]:["Oven/broiler: sheet pan, broil about 4–6 min per side for steak/chops; chicken bake 400°F about 20–25 min."];
  const tn={grill:"🔥 On your Foreman",stove:"🍳 Stovetop",air:"💨 Air fryer",oven:"♨️ Oven"}[t];
  return `<div class="tip"><b>${tn}</b><ol>${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
   ${t==="grill"?`<div class="t1">⏱ Approx. ${esc(m.time)}</div>`:""}<div class="t2">🌡 Check ${esc(m.temp)}</div>
   <div class="t3">Times are approximate; grills vary. A cheap instant-read thermometer (~$10–15) is the real test. Leftovers: reheat to 165°F.</div></div>`}
const tipsBox=()=>`<details class="box"><summary>💰 Meat money tips (tap)</summary><ul>${C.TIPS.meat.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></details>`;
const mv=id=>st.mealV[id]||(M(id).v?M(id).v[0]:"");
/* ---- render ---- */
function render(){
  progress();setTimeout(()=>{const p=card.querySelector(".pop,.addrow.cust");if(p&&p.scrollIntoView)p.scrollIntoView({block:"nearest",behavior:"smooth"})},0);
  const s=queue[pos];
  if(typeof s==="object") return s.build?buildScreen(s.build):drill(s);
  if(s==="stores"){
    card.innerHTML=`<div class="emoji">🛒</div><h1>Where do you shop?</h1><p class="sub">Tap every store you use.</p>
      ${chipList([...STORES,...st.extra],st.stores)}
      <div class="addrow"><input id="own" placeholder="Other store…" maxlength="30"><button id="add">Add</button></div>
      ${btns("Next →",!st.stores.size)}`;
    bindChips(st.stores);
    const add=()=>{const v=$("own").value.trim();if(v&&!STORES.includes(v)&&!st.extra.includes(v)){st.extra.push(v);st.stores.add(v)}render()};
    $("add").onclick=add;$("own").onkeydown=e=>{if(e.key==="Enter")add()};
    $("nx").onclick=()=>st.stores.size&&go();
  } else if(s==="main"){
    card.innerHTML=`<div class="emoji">⭐</div><h1>Which store most?</h1><p class="sub">Prices and the grocery list lean toward this one.</p>
      <div class="chips">${[...st.stores].map(x=>`<span class="chip${st.main===x?" main":" off"}" data-x="${esc(x)}">${esc(x)}</span>`).join("")}</div>${btns("Next →",!st.main)}`;
    card.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{st.main=c.dataset.x;render()});
    $("nx").onclick=()=>st.main&&go();
  } else if(s==="about") aboutStep();
  else if(s==="photos"){
    const tile=(k,e,l)=>`<label class="ph${st.photos[k]?" done":""}">${st.photos[k]?`<img src="${st.photos[k]}"><span class="ok">✓ ${l}</span>`:`<span class="big">${e}</span>${l}<br>Tap for photo`}<input type="file" accept="image/*" capture="environment" data-k="${k}"></label>`;
    const n=Object.keys(st.photos).length;
    card.innerHTML=`<div class="emoji">📸</div><h1>Show me what you have</h1><p class="sub">One photo each so I can see what's already there.</p>
      <div class="photos">${tile("pantry","🥫","Pantry")}${tile("fridge","🧊","Fridge")}${tile("freezer","❄️","Freezer")}</div>
      ${btns(n===3?"Next →":`Next → (${n}/3)`,false,n<3?"Skip photos for now":null)}`;
    card.querySelectorAll("input[type=file]").forEach(inp=>inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{st.photos[inp.dataset.k]=r.result;render()};r.readAsDataURL(f)});
    $("nx").onclick=()=>go();const sk=$("sk");if(sk)sk.onclick=()=>go();
  } else if(s==="equip"){
    const fm=st.equip.has("foreman");
    const rest=C.EQUIP.filter(e=>!e.featured);
    card.innerHTML=`<div class="emoji">🍳</div><h1>What do you cook with?</h1><p class="sub">Tap what you've got. Meals lean toward these.</p>
      <div class="feat${fm?" on":""}" id="fm"><div class="fe">🔥</div><div><b>George Foreman grill</b><div class="dad">🎁 Dad got you this. Still your go-to?</div></div><div class="ck">${fm?"✓":""}</div></div>
      <p class="fnote">${fm?"✓ Yep. Meals and cook times are built around the Foreman.":"Tap the card if you still use it."}</p>
      <p class="lbl">Also have</p>
      <div class="chips">${rest.map(e=>`<span class="chip${st.equip.has(e.id)?"":" off"}" data-e="${e.id}">${e.emoji} ${e.label}</span>`).join("")}${(st.custom.equip||[]).map(v=>`<span class="chip cust${st.equip.has("c:"+v)?"":" off"}" data-e="c:${esc(v)}">🔧 ${esc(v)}</span>`).join("")}${customChip("equip")}</div>${customRow("equip")}
      <p class="fnote">${st.equip.has("espresso")?"☕ Espresso machine is on. Next step: your coffee (drinks, milk, how many).":"No espresso machine? Fine, the coffee step is skipped."}</p>
      <div class="snap"><p class="lbl" style="margin-top:0">Anything else in your kitchen?</p>
        <p>Not sure if you have something? 📸 Snap a photo of your counters/cabinets and send it to your chef bot. It'll tell you what you've got.</p>
        <button class="sbtn" id="kitSnap">📸 Snap a photo</button><input type="file" accept="image/*" capture="environment" id="kitIn" hidden>
        <div class="thumbs" id="kitThumbs"></div><div id="kitAct"></div>
        <p class="muted" style="margin-top:6px">This page can't see what's in the photo. Your chef bot reads it. Photos stay on your phone unless you share them.</p></div>
      ${btns("Next →")}`;
    $("fm").onclick=()=>{fm?st.equip.delete("foreman"):st.equip.add("foreman");render()};
    card.querySelectorAll(".chip[data-e]").forEach(c=>c.onclick=()=>{const k=c.dataset.e;st.equip.has(k)?st.equip.delete(k):st.equip.add(k);render()});
    bindCustom((k,v)=>{st.custom.equip=st.custom.equip||[];if(!st.custom.equip.includes(v))st.custom.equip.push(v);st.equip.add("c:"+v)});
    $("nx").onclick=()=>go();
    photoShare({btn:$("kitSnap"),input:$("kitIn"),thumbs:$("kitThumbs"),act:$("kitAct"),store:st.kitPhotos,
      shareLabel:"Send to my chef bot",title:"Kitchen photo",text:"What do I have here? (photo from my meal picker)",
      fallback:"Saved. Send this photo to your chef bot (long-press it → Save, then send it in chat)."});
  } else if(s==="coffee") coffeeStep();
  else if(s==="meals") meals();
  else if(s==="sides"){

/* Long-press (~500ms). Short tap keeps normal click. Cancels if finger moves. */
function longPress(el,fn,ms){ms=ms||500;let t=null,x=0,y=0,fired=false;
  el.classList.add("lp");
  el.addEventListener("pointerdown",e=>{if(e.button>0)return;fired=false;x=e.clientX;y=e.clientY;clearTimeout(t);t=setTimeout(()=>{t=null;fired=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}fn()},ms)});
  const cancel=()=>{clearTimeout(t);t=null};
  el.addEventListener("pointermove",e=>{if(t&&Math.hypot(e.clientX-x,e.clientY-y)>10)cancel()});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>el.addEventListener(ev,cancel));
  el.addEventListener("contextmenu",e=>e.preventDefault());
  el.addEventListener("click",e=>{if(fired){e.preventDefault();e.stopImmediatePropagation();fired=false}},true)}

function attachShare(o){
  const files=o.files;
  const draw=()=>{
    o.thumbs.innerHTML=files.map(f=>`<img alt="photo" src="${f._url}">`).join("");
    if(!files.length){o.act.innerHTML="";return}
    const can=!!(navigator.canShare&&navigator.share&&navigator.canShare({files}));
    o.act.innerHTML=can?`<button class="${o.btnClass||"sbtn"}" data-share="1">${o.shareLabel}</button><p class="shr-msg" data-msg></p>`
      :`<p class="shr-msg">${o.fallback}</p>`;
    const sb=o.act.querySelector("[data-share]");
    if(sb)sb.onclick=async()=>{const msg=o.act.querySelector("[data-msg]");
      try{await navigator.share({files,title:o.title,text:o.text});msg.textContent="Shared. "+(o.after||"")}
      catch(err){msg.textContent=err&&err.name==="AbortError"?"Share cancelled. Tap again when ready.":o.fallback}};
  };
  o.inputs.forEach(inp=>inp.addEventListener("change",()=>{[...inp.files].forEach(f=>{f._url=URL.createObjectURL(f);files.push(f)});inp.value="";draw()}));
  draw();
}

    ${ids.length?`${g(2).length?`<h3 class="aisle">⭐ Favorites (❤️)</h3><ul>${g(2).map(id=>row(id)).join("")}</ul>`:""}${g(1).length?`<h3 class="aisle">👍 Good</h3><ul>${g(1).map(id=>row(id)).join("")}</ul>`:""}${g(-1).length?`<h3 class="aisle">🗑 Removed meals</h3><p class="hint" style="margin:0 0 4px">Rated 👎 or removed from the menu for good. Hidden from suggestions and Swap. Tap Restore to bring one back.</p><ul>${g(-1).map(id=>row(id,true)).join("")}</ul>`:""}`
      :`<p class="hint">No ratings yet. After you make a meal, tap 👎 / 👍 / ❤️ on its day. ❤️ = ⭐ favorite, picked more; 👎 meals stop showing up.</p>`}</section>`}
/* receipt button */
function bindReceipt(root){root.querySelectorAll("[data-rcpt]").forEach(b=>b.onclick=openReceipt)}
function photoShare(o){o.btn.onclick=()=>o.input.click();attachShare({inputs:[o.input],thumbs:o.thumbs,act:o.act,files:o.store,shareLabel:o.shareLabel,title:o.title,text:o.text,fallback:o.fallback})}
/* prices.json (same folder). Falls back to the built-in estimates in meals.js. */
const PRICE_META={updated:"2026-10-05",loaded:false,stores:["aldi-stpete","publix-stpete"]};
Object.values(C.PRICES).forEach(v=>{v.sA=v.sA||{source:"estimate",checked:"2026-10-05"};v.sP=v.sP||{source:"estimate",checked:"2026-10-05"}});
function srcPair(it){const a=srcLabel(it.sA),p=srcLabel(it.sP);return a===p?a:`Aldi ${a} · Publix ${p}`}
fetch("prices.json",{cache:"no-cache"}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{
  if(!j||!j.items)return;const [sa,sp]=PRICE_META.stores;

    it.prices.forEach(e=>{if(e.store===sa&&e.price!==undefined){P.a=e.price;P.sA=e}else if(e.store===sp&&e.price!==undefined){P.p=e.price;P.sP=e}})});
  if(j.updated)PRICE_META.updated=j.updated;PRICE_META.loaded=true;

/* ---- v4: coffee, copy list, toast, per-day Swap + 🗑 Delete, meal log + week review ---- */
function isoD(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function coffeeCalc(){const K=C.COFFEE,c=st.coffee,P=C.PRICES;const ds=K.drinks.filter(d=>c.drinks.has(d.id));const list=ds.length?ds:[K.drinks[0]];
  const n=c.perWeek;const avgMilk=c.milk==="No milk"?0:list.reduce((a,d)=>a+d.milk,0)/list.length;
  const milkOz=Math.round(n*avgMilk),g=n*K.gPerDrink,bags=Math.max(1,Math.ceil(g/K.bagG));
  const milkKey=milkOz>0&&P["coffee:"+c.milk]?"coffee:"+c.milk:null,halfGal=milkKey?Math.max(1,Math.ceil(milkOz/K.milkOz)):0,syrup=c.syrup!=="None";
  const bp=x=>Math.min(x.a,x.p);
  const home=g/K.bagG*bp(P["coffee:beans"])+(milkKey?milkOz/K.milkOz*bp(P[milkKey]):0)+(syrup?n/12*bp(P["coffee:syrup"]):0);
  const out=n*K.outPrice;return {n,g,bags,milkOz,milkKey,halfGal,syrup,home,out,save:out-home}}
function coffeeDesc(){const K=C.COFFEE,c=st.coffee;const ds=K.drinks.filter(d=>c.drinks.has(d.id)).map(d=>d.label);
  return `${esc(ds.join(", ")||"Latte")} · ${esc(c.milk)}${c.syrup!=="None"?" · "+esc(c.syrup)+" syrup":""} · ${c.perWeek} drinks/week`}
function coffeeLine(short){const k=coffeeCalc();const base=`Coffee at home ~$${k.home.toFixed(2)}/week vs ~$${k.out.toFixed(2)} buying out (${k.n} drinks × ~$${C.COFFEE.outPrice.toFixed(2)}) · est. Saves ~$${Math.max(0,k.save).toFixed(0)}/week.`;
  if(short||!W)return base;const ci=W.items.filter(it=>it.aisle==="coffee"&&!W.have.has(it.id));const tot=ci.reduce((a,it)=>a+Math.min(it.a==null?1e9:it.a,it.p==null?1e9:it.p),0);
  return `${base} Coffee groceries on this list: ~$${tot.toFixed(2)} est., counted in the totals and your budget.`}
function coffeeStep(){const K=C.COFFEE,c=st.coffee;
  card.innerHTML=`<div class="emoji">☕</div><h1>Your coffee</h1><p class="sub">You've got an espresso machine. What do you make with it?</p>
    <p class="lbl">Drinks (tap all you make)</p><div class="chips">${K.drinks.map(d=>`<span class="chip${c.drinks.has(d.id)?"":" off"}" data-cd="${d.id}">${d.emoji} ${d.label}</span>`).join("")}</div>
    <p class="lbl">Milk</p><div class="chips">${K.milks.map(m=>`<span class="chip${c.milk===m?"":" off"}" data-cmk="${esc(m)}">${esc(m)}</span>`).join("")}</div>
    <p class="lbl">Syrup</p><div class="chips">${K.syrups.map(m=>`<span class="chip${c.syrup===m?"":" off"}" data-csy="${esc(m)}">${esc(m)}</span>`).join("")}</div>
    <p class="lbl">How many drinks a week?</p><div class="chips">${K.perWeek.map(n=>`<span class="chip${c.perWeek===n?"":" off"}" data-cw="${n}">${n}</span>`).join("")}</div>
    <div class="cofbox">☕ ${coffeeLine(true)}<br><small>Beans, milk and syrup go on your shopping list (Coffee section) and count in your budget. Café price ~$5.50/drink is a rough estimate.</small></div>
    ${btns("Next →")}`;
  card.querySelectorAll("[data-cd]").forEach(b=>b.onclick=()=>{const k=b.dataset.cd;c.drinks.has(k)?c.drinks.delete(k):c.drinks.add(k);render()});
  card.querySelectorAll("[data-cmk]").forEach(b=>b.onclick=()=>{c.milk=b.dataset.cmk;render()});
  card.querySelectorAll("[data-csy]").forEach(b=>b.onclick=()=>{c.syrup=b.dataset.csy;render()});
  card.querySelectorAll("[data-cw]").forEach(b=>b.onclick=()=>{c.perWeek=+b.dataset.cw;render()});
  $("nx").onclick=()=>go()}
function toast(msg,undo){const t=$("toast2");clearTimeout(toast._t);t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="t2u">Undo</button>':""}`;t.classList.add("show");
  if(undo)$("t2u").onclick=()=>{clearTimeout(toast._t);t.classList.remove("show");undo()};toast._t=setTimeout(()=>t.classList.remove("show"),undo?5000:2400)}
async function copyTxt(text,msg){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else throw 0}
  catch(_){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove()}
  toast("📋 "+msg)}
function listText(which){const t=totals(),wl=fmtWeek(weekStartDate()),items=W.items.filter(it=>!W.have.has(it.id));
  const aw=it=>it.a!=null&&(it.p==null||it.a<=it.p),pw=it=>it.p!=null&&!aw(it);
  const pr=it=>`Aldi ${it.a==null?"n/a":"est. "+$$(it.a)} / Publix ${it.p==null?"n/a":"est. "+$$(it.p)}`;const L=[];
  if(which==="all"){L.push(`My shopping list: ${wl}`,`Est. totals: All Aldi ${$$(t.a)} · All Publix ${$$(t.p)} · Best split ${$$(t.b)}`);if(st.equip.has("espresso"))L.push(coffeeLine(true));
    AISLES.forEach(([k,lab])=>{const g=items.filter(i=>i.aisle===k);if(!g.length)return;L.push("",lab.toUpperCase());
      g.forEach(it=>L.push(`[ ] ${it.n}${it.q?" ("+it.q+")":""} - ${it.custom?"check price":pr(it)}${aw(it)?" · Aldi cheaper":pw(it)?" · Publix cheaper":""}`))})}
  else{const pick=which==="Aldi"?aw:pw,g=items.filter(pick),sum=g.reduce((a,it)=>a+(which==="Aldi"?it.a:it.p),0);
    L.push(`${which} list (best split): ${wl}`,`${g.length} items · est. ${$$(sum)}`);
    AISLES.forEach(([k,lab])=>{const h=g.filter(i=>i.aisle===k);if(!h.length)return;L.push("",lab.toUpperCase());h.forEach(it=>L.push(`[ ] ${it.n}${it.q?" ("+it.q+")":""} - est. ${$$(which==="Aldi"?it.a:it.p)}`))})}
  L.push("","Prices are estimates (St. Pete area). Check in store.");return L.join("\n")}
function openDaySwap(i){const d=effDays(W.ov)[i],o=W.ov[i];
  const opts=MEALS.filter(m=>m.id!=="veg"&&rateOf(m.id)!==-1).sort((a,b)=>(rateOf(b.id)===2)-(rateOf(a.id)===2)||(yes(b.id)-yes(a.id)));
  const inn=openSheet(shTop("Swap "+esc(d.short))+`<p class="muted2" style="margin:0 0 8px">Now: <b>${d.e} ${esc(d.dinner)}</b></p>
    <div class="cz-o">${o?`<button data-o="keep">↩ Original</button>`:""}<button data-o="left">Leftovers</button><button data-o="out">Eat out</button></div>
    <div class="cz-list">${opts.map(m=>`<button data-pick="${m.id}">${rateOf(m.id)===2?"⭐ ":""}${m.emoji} ${esc(m.name)}${m.v?" ("+esc(mv(m.id))+")":""}</button>`).join("")}</div>
    <p class="muted2">👎 and removed meals aren't offered. The shopping list updates right away.</p>`,"Swap dinner");
  const done=(v,msg)=>{if(v)W.ov[i]=v;else delete W.ov[i];recomputeList();closeSheet();renderWeek();toast(msg)};
  inn.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const a=b.dataset.o;done(a==="keep"?null:{t:a},a==="keep"?"Back to the original dinner":a==="left"?"Swapped to Leftovers":"Swapped to Eat out")});
  inn.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>done({t:"meal",id:b.dataset.pick},"Dinner swapped. List updated"))}
function openDelete(i){const d=effDays(W.ov)[i],m=d.meal&&M(d.meal);
  const inn=openSheet(shTop("🗑 Delete "+esc(d.short)+" dinner")+`<p style="margin:0 0 10px;font-weight:800">${d.e} ${esc(d.dinner)}</p>
    <button class="sh-btn wide" data-rm="week">Remove from this week</button><p class="muted2" style="margin:4px 0 12px">Frees up this night and takes its groceries off the list. You get 5 seconds to Undo.</p>
    <button class="sh-btn wide danger" data-rm="good" ${m?"":"disabled"}>Remove from menu for good</button><p class="muted2" style="margin:4px 0 0">${m?`Moves ${esc(m.name)} to Removed meals. It won't be suggested or offered in Swap. Tap Restore there anytime.`:"Only menu meals can be removed for good (this night isn't one)."}</p>`,"Delete dinner");
  inn.querySelector('[data-rm="week"]').onclick=()=>{const prev=W.ov[i];W.ov[i]={t:"rm"};recomputeList();closeSheet();renderWeek();
    toast(`Removed from this week: ${d.short}`,()=>{if(prev)W.ov[i]=prev;else delete W.ov[i];recomputeList();renderWeek();toast("Undone. It's back on the week")})};
  if(m)inn.querySelector('[data-rm="good"]').onclick=()=>confirmForGood(m)}
function confirmForGood(m){const inn=openSheet(shTop("Remove for good?")+`<p style="margin:0 0 8px;font-weight:800">Remove ${m.emoji} ${esc(m.name)} from your menu for good?</p>
    <p class="muted2" style="margin:0 0 10px">It moves to <b>Removed meals</b> and won't be suggested or offered in Swap. You can tap Restore there anytime.</p>
    <div class="sh-row2"><button class="sh-btn" data-c="no">Cancel</button><button class="sh-btn danger" data-c="yes">Remove for good</button></div>`,"Confirm remove from menu for good");
  inn.querySelector('[data-c="no"]').onclick=closeSheet;
  inn.querySelector('[data-c="yes"]').onclick=()=>{setRate(m.id,-1,true);effDays(W.ov).forEach((x,j)=>{if(x.meal===m.id)W.ov[j]={t:"rm"}});recomputeList();closeSheet();renderWeek();
    toast(`${m.name} removed from menu for good. Restore it in Removed meals.`)}}
/* meal log (saved on this phone) */
const LKEY="cameron-meals-log-v1";
function getLog(){try{const j=JSON.parse(localStorage.getItem(LKEY)||"null");if(j&&typeof j==="object"&&j.log)return j}catch(_){}return {log:{},prompt:null,seen:null}}
function setLog(L){try{localStorage.setItem(LKEY,JSON.stringify(L))}catch(_){}}
const LS=[["made","✅ Made"],["skip","⏭ Skipped"],["out","🍽 Ate out"]];
const logKey=e=>e.m||e.n;
const mealName=k=>{const m=M(k);return m?m.emoji+" "+m.name:k};
function timesMade(k){return Object.values(getLog().log).filter(e=>e.s==="made"&&logKey(e)===k).length}
function logCtl(date){const iso=isoD(date),e=getLog().log[iso]||{};
  return `<div class="lr"><span>Log it:</span>${LS.map(([v,l])=>`<button data-ls="${v}" data-ld="${iso}" aria-pressed="${e.s===v}">${l}</button>`).join("")}</div>
  ${e.s==="made"?`<div class="lr"><span>Leftovers:</span>${[0,1,2,3].map(n=>`<button data-llo="${n}" data-ld="${iso}" aria-pressed="${e.lo===n}">${n}</button>`).join("")}</div><div class="lr"><span>Went bad?</span><button data-lbad="0" data-ld="${iso}" aria-pressed="${e.bad===false}">No</button><button data-lbad="1" data-ld="${iso}" aria-pressed="${e.bad===true}">Yes</button></div>`:""}`}
function logRow(i,d){const date=addDays(weekStartDate(),i),k=d.meal||null,n=k?timesMade(k):0;
  return `<div class="log" onclick="event.stopPropagation()">${logCtl(date)}${n?`<p class="lct">Made ${n}× all-time${rateOf(k)===2?" · ⭐ favorite":""}</p>`:""}</div>`}
function bindLog(root,days,map,after){map=map||{};after=after||renderWeek;
  if(days)days.forEach((d,i)=>{map[isoD(addDays(weekStartDate(),i))]={m:d.meal||null,n:d.dinner}});
  const upd=(iso,f)=>{const L=getLog();const e=L.log[iso]||{m:map[iso]?map[iso].m:null,n:map[iso]?map[iso].n:""};f(e);if(e.s)L.log[iso]=e;else delete L.log[iso];setLog(L);return e};
  root.querySelectorAll("[data-ls]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();const v=b.dataset.ls;
    const e=upd(b.dataset.ld,e=>{if(e.s===v)e.s=null;else{e.s=v;if(v!=="made"){delete e.lo;delete e.bad}}});after();
    if(e.s==="made")toast(e.m&&!rateOf(e.m)?"✅ Logged as made. How was it? Rate it 👎 / 👍 / ❤️":"✅ Logged as made");else if(e.s)toast(e.s==="skip"?"⏭ Logged as skipped":"🍽 Logged as ate out")});
  root.querySelectorAll("[data-llo]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();upd(b.dataset.ld,e=>{e.lo=+b.dataset.llo});after()});
  root.querySelectorAll("[data-lbad]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();upd(b.dataset.ld,e=>{e.bad=b.dataset.lbad==="1"});after()});
  const go3=root.querySelector("#lgGo");if(go3){go3.onclick=()=>openLogSheet(days);root.querySelector("#lgLater").onclick=()=>{const L=getLog();L.prompt=isoD(new Date());setLog(L);renderWeek()}}}
function last3(days){const t=new Date(),out=[];for(let k=3;k>=1;k--){const d=addDays(t,-k),idx=(d.getDay()+6)%7,p=days[idx];
  out.push({date:d,iso:isoD(d),m:p.meal||null,n:p.dinner,e:p.e,label:`${DN[idx]} ${d.getMonth()+1}/${d.getDate()}`})}return out}
function logBanner(days){const L=getLog(),today=isoD(new Date());if(!L.seen){L.seen=today;setLog(L)}
  const since=Math.floor((Date.now()-new Date((L.prompt||L.seen)+"T00:00:00").getTime())/864e5);
  if(since<3||!last3(days).some(x=>!L.log[x.iso]))return "";
  return `<div class="logb"><b>📝 Quick check-in</b><span>How did the last 3 days go? A few taps keeps your suggestions smart.</span><div><button class="lb p" id="lgGo">Log last 3 days</button><button class="lb" id="lgLater">Later</button></div></div>`}
function openLogSheet(days){const items=last3(days),map={};items.forEach(x=>map[x.iso]={m:x.m,n:x.n});const inn=openSheet("","Log the last 3 days");
  const fin=()=>{const L=getLog();L.prompt=isoD(new Date());setLog(L);closeSheet();renderWeek()};
  const draw=()=>{inn.innerHTML=shTop("📝 Log the last 3 days")+`<p class="muted2" style="margin:0 0 8px">Shown: what your plan has for that weekday. Tap what actually happened.</p>`+
    items.map(x=>`<div class="lgc"><div class="lgh">${x.label} · ${x.e} ${esc(x.n)}</div><div class="log">${logCtl(x.date)}</div></div>`).join("")+
    `<div class="sh-row2"><button class="sh-btn" id="lgL">Later</button><button class="sh-btn p" id="lgD">Done</button></div>`;
    bindLog(inn,null,map,draw);inn.querySelector("#lgD").onclick=fin;inn.querySelector("#lgL").onclick=fin};draw()}
function weekReview(days){const L=getLog().log,s0=weekStartDate();
  const wk=days.map((d,i)=>({d,e:L[isoD(addDays(s0,i))]}));
  const planned=wk.filter(x=>x.d.kind!=="rm"&&x.d.kind!=="out").length,c=v=>wk.filter(x=>x.e&&x.e.s===v).length;
  const wasted=wk.reduce((a,x)=>a+(x.e&&x.e.bad?(x.e.lo||1):0),0);
  const top=[...new Set(wk.filter(x=>x.e&&x.e.s==="made"&&x.e.m).map(x=>x.e.m))].filter(id=>rateOf(id)>0).sort((a,b)=>rateOf(b)-rateOf(a));
  const all=Object.values(L),keys=[...new Set(all.map(logKey).filter(Boolean))];
  const S=keys.map(k=>{const es=all.filter(e=>logKey(e)===k);return {k,made:es.filter(e=>e.s==="made").length,skip:es.filter(e=>e.s==="skip").length,bad:es.filter(e=>e.bad).length}});
  const tm=S.filter(x=>x.made).sort((a,b)=>b.made-a.made),sug=[];
  S.forEach(x=>{const nm=mealName(x.k),di=days.findIndex(d=>d.meal===x.k);
    if(x.skip>=2)sug.push(`<li>⏭ <b>${esc(nm)}</b>: Skipped ${x.skip===2?"twice":x.skip+" times"}: swap it?${di>=0?` <button class="have" data-swapd="${di}">Swap</button>`:""}</li>`);
    if(x.bad)sug.push(`<li>🗑 <b>${esc(nm)}</b>: Leftovers went bad: make a smaller batch.</li>`);
    if(M(x.k)&&x.made>=2&&!rateOf(x.k))sug.push(`<li>👍 <b>${esc(nm)}</b>: Made ${x.made}×: rate it? ❤️ gets it suggested more.</li>`);
    if(M(x.k)&&x.made&&rateOf(x.k)===2)sug.push(`<li>⭐ <b>${esc(nm)}</b>: ❤️ favorite: keep it in the rotation.</li>`)});
  const RE={"-1":"👎","1":"👍","2":"❤️"};
  return `<section class="gpanel wrev"><div class="stitle" style="margin-top:0"><h2>Week review</h2><span>${esc(fmtWeek(s0))}</span></div>
   <div class="wst"><div><b>${c("made")}/${planned}</b>made vs planned</div><div><b>${c("skip")}</b>skipped</div><div><b>${c("out")}</b>ate out</div><div class="${wasted?"bad":""}"><b>${wasted}</b>leftovers wasted</div></div>
   <p class="wtop">${top.length?`Top-rated this week: ${top.map(id=>`${RE[rateOf(id)]} ${esc(M(id).name)}`).join(" · ")}`:"Top-rated this week: rate the meals you made (👎 / 👍 / ❤️) and they show up here."}</p>
   <h3 class="aisle">Times made (all-time)</h3>${tm.length?`<ul class="tml">${tm.map(x=>`<li><span>${esc(mealName(x.k))}</span>${M(x.k)&&rateOf(x.k)?`<small>${RE[rateOf(x.k)]}</small>`:""}<b>×${x.made}</b></li>`).join("")}</ul>`:`<p class="hint">Nothing logged yet. Tap ✅ Made on a day after you cook it.</p>`}
   <h3 class="aisle">Suggestions</h3>${sug.length?`<ul class="sgl">${sug.join("")}</ul>`:`<p class="hint">Log a few days and simple tips show up here (like "Skipped twice: swap it?").</p>`}</section>`}

initSheet();bindReceipt(document);
reset();render();
